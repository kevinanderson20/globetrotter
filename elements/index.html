<style>
/* Elements: learn the periodic table. Home is a trail of lessons row by row; play is the table on top with answers docked below. */
:root{
  --bg:#eaf4fa; --surface:#ffffff; --surface-2:#f3f8fb; --line:#d6e5ee;
  --ink:#10233a; --ink-2:#47596e; --ink-3:#8293a5;
  --sun:#ffb21e; --sun-ink:#4a3000; --good:#1fa25c; --bad:#ec5646;
  --add:#24a167; --sub:#3f67d8; --mul:#ec7f19; --div:#8b54d0; --hot:#de3f58; --pct:#0f9ea0;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1520; --surface:#12212e; --surface-2:#172938; --line:#22384a;
  --ink:#eaf3fa; --ink-2:#a8bccc; --ink-3:#6f8699;
  --sun:#ffc23f; --sun-ink:#3a2500; --good:#3cc77b; --bad:#ff7363;
  --add:#3cc485; --sub:#6b8cf0; --mul:#ff9a3d; --div:#a77ae6; --hot:#ff6680; --pct:#2cc4c4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1520; --surface:#12212e; --surface-2:#172938; --line:#22384a;
  --ink:#eaf3fa; --ink-2:#a8bccc; --ink-3:#6f8699;
  --sun:#ffc23f; --sun-ink:#3a2500; --good:#3cc77b; --bad:#ff7363;
  --add:#3cc485; --sub:#6b8cf0; --mul:#ff9a3d; --div:#a77ae6; --hot:#ff6680; --pct:#2cc4c4;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
body.playing{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:12px}
.brand h1{font-size:24px;font-weight:800}
.brand svg{flex:none}
.tabs{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{padding:7px 2px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--ink-2);text-decoration:none;text-align:center;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
/* setup card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.card h3{font-size:18px;font-weight:800}
.muted{color:var(--ink-2);font-size:14px;margin:0}
/* modes */
.mode{position:relative;overflow:hidden;border:0;border-radius:22px;padding:16px 18px;text-align:left;color:#fff;background:var(--cc);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--cc) 60%,#000 40%);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.mode b{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.mode span{font-size:14px;opacity:.92;grid-column:1}
.mode i{font-style:normal;grid-row:1/3;grid-column:2;font-family:var(--f-display);font-weight:800;font-size:14px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:grid;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-size:16px;font-weight:800}
.tile span{font-size:13px;color:var(--ink-2);line-height:1.3}
.tile .ex{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 18px;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--ink);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000 45%)}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000 40%)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;border:2px solid var(--line);font-family:var(--f-body);font-weight:700;font-size:15px;min-height:46px}
.btn.small{min-height:40px;font-size:14px;padding:0 14px}
.foot{display:grid;gap:10px;justify-items:center;font-size:12px;color:var(--ink-3);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.statrow{display:grid;grid-template-columns:28px 1fr auto auto;gap:4px 10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.statrow .o{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);text-align:center}
.statrow em{font-style:normal;color:var(--ink-2);font-size:13px}
.statrow .bar2{grid-column:2/-1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.statrow .bar2 i{display:block;height:100%;border-radius:9px;background:var(--c)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-family:var(--f-display);font-weight:800;font-size:15px;border-radius:10px;padding:5px 10px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--ink);font-variant-numeric:tabular-nums}
/* inner screens */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:calc(-14px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:17px}
/* results */
.big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.center{text-align:center}
.cheer{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--good)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:1px;text-align:center}
.kv b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--ink-2)}
/* new modes */
.mode.sm{grid-template-columns:1fr;padding:14px}
.mode.sm b{font-size:18px}.mode.sm span{font-size:13px}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg3{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.seg2 button,.seg3 button{min-height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 6px;line-height:1.2}
.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.kv{grid-template-columns:repeat(3,1fr)}

/* ================= elements ================= */
:root{--f-alk:#ffb4a6;--f-ear:#ffd49a;--f-tra:#ffe7a3;--f-pst:#cfe8b8;--f-met:#b4e4d6;--f-non:#bfe0ff;--f-hal:#cfcaff;--f-nob:#ecc9f7;--f-lan:#fbc9de;--f-act:#f5b8c4;--el-ink:#1b2430;
  --m0:var(--surface-2);--m1:#ffe3a6;--m2:#b9e6c6;--m3:#1fa25c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--f-alk:#7a3329;--f-ear:#7a5222;--f-tra:#6b5c1f;--f-pst:#3d5a2c;--f-met:#1f5a4c;--f-non:#1f4a72;--f-hal:#463e86;--f-nob:#5e2f72;--f-lan:#74304e;--f-act:#73303d;--el-ink:#f2f6fa;--m1:#6b5418;--m2:#2c6a44;--m3:#3cc77b}}
:root[data-theme="dark"]{--f-alk:#7a3329;--f-ear:#7a5222;--f-tra:#6b5c1f;--f-pst:#3d5a2c;--f-met:#1f5a4c;--f-non:#1f4a72;--f-hal:#463e86;--f-nob:#5e2f72;--f-lan:#74304e;--f-act:#73303d;--el-ink:#f2f6fa;--m1:#6b5418;--m2:#2c6a44;--m3:#3cc77b}
.f-alk{--fc:var(--f-alk)}.f-ear{--fc:var(--f-ear)}.f-tra{--fc:var(--f-tra)}.f-pst{--fc:var(--f-pst)}.f-met{--fc:var(--f-met)}.f-non{--fc:var(--f-non)}.f-hal{--fc:var(--f-hal)}.f-nob{--fc:var(--f-nob)}.f-lan{--fc:var(--f-lan)}.f-act{--fc:var(--f-act)}
/* the table */
.pt{container-type:inline-size;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(7,auto) 5px repeat(2,auto);gap:2px;width:100%}
.el{position:relative;aspect-ratio:1/1.14;border:0;padding:0;border-radius:3px;background:var(--fc);color:var(--el-ink);display:grid;place-items:center;font-family:var(--f-display);min-width:0;transition:transform .15s,background .2s,opacity .2s,box-shadow .2s}
.el b{font-size:2.85cqw;font-weight:800;line-height:1;letter-spacing:-.02em}
.el small{position:absolute;left:1px;top:0;font-size:1.45cqw;font-weight:700;opacity:.65;line-height:1.1;display:none}
@container (min-width:560px){.el small{display:block}.el b{font-size:2.5cqw;margin-top:.6cqw}}
.el .w{display:none;font-style:normal;font-family:var(--f-body);font-weight:600;font-size:.95cqw;opacity:.75;line-height:1;margin-top:.2cqw;font-variant-numeric:tabular-nums}
@container (min-width:900px){.el{align-content:center;gap:0}.el .w{display:block}.el b{font-size:2.2cqw;margin-top:.9cqw}.el small{font-size:1cqw;left:3px;top:2px}}
.el.blank .w{visibility:hidden}
.extab.big{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.extab.big .pt{width:920px}
.ph{grid-column:3;display:grid;place-items:center;border-radius:3px;background:var(--fc);opacity:.45;font:700 1.3cqw var(--f-body);color:var(--el-ink);aspect-ratio:1/1.14;overflow:hidden;white-space:nowrap}
.gap{grid-column:1/-1}
.el.dim{opacity:.18}
.el.blank b,.el.blank small{visibility:hidden}
.pt.plain .el{background:var(--surface-2)}
.pt.mastery .el{background:var(--m0);color:var(--ink-3)}
.pt.mastery .el[data-m="1"]{background:var(--m1);color:var(--el-ink)}
.pt.mastery .el[data-m="2"]{background:var(--m2);color:var(--el-ink)}
.pt.mastery .el[data-m="3"]{background:var(--m3);color:#fff}
.el.hl{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun);z-index:2;transform:scale(1.12)}
.el.hl.blank{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun),0 0 14px 4px color-mix(in srgb,var(--sun) 70%,transparent)}}
.el.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun);z-index:2;animation:glow 1.3s ease-in-out infinite}
.el.ok{background:var(--good)!important;color:#fff!important;transform:scale(1.18);z-index:3}
.el.bad{background:var(--bad)!important;color:#fff!important;z-index:3}
.el.pick{background:var(--ink-3)!important;color:#fff!important}
.el.ok b,.el.bad b,.el.pick b{visibility:visible}
.el.pop{animation:pop .6s ease}
@keyframes pop{30%{transform:scale(1.45)}}
.el.got b{visibility:visible}
.el.peek b{visibility:visible;opacity:.45}
/* home */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip small{font-weight:500;color:var(--ink-2);font-size:13px}
.next{position:relative;overflow:hidden;border:0;border-radius:22px;padding:18px;text-align:left;color:#fff;background:var(--cc);display:grid;gap:10px;box-shadow:0 6px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.next:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.next .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.9}
.next h2{font-size:27px;font-weight:800;line-height:1.05}
.next p{margin:0;font-size:15px;opacity:.92}
.next .go{justify-self:start;background:#fff;color:var(--cc);font-weight:800;border-radius:12px;padding:10px 18px;font-size:16px}
.syms{display:flex;flex-wrap:wrap;gap:6px}
.syms span{position:relative;width:46px;height:50px;border-radius:9px;display:grid;place-items:center;font:800 20px var(--f-display);background:var(--fc,rgba(255,255,255,.22));color:var(--el-ink)}
.next .syms span{color:#fff}
.syms small{position:absolute;left:4px;top:2px;font-size:10px;font-weight:700;opacity:.7}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.histbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.mini{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--fc,var(--m0));border:1px solid var(--line)}
.legend [data-m="1"]::before{background:var(--m1)}.legend [data-m="2"]::before{background:var(--m2)}.legend [data-m="3"]::before{background:var(--m3)}
.unit{border-left:6px solid var(--cc);gap:8px}
.uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ucount{font:800 14px var(--f-display);color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--surface));border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.lrow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.lrow.nx{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 7%,var(--surface))}
.lnum{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-display);background:var(--surface-2);color:var(--ink-2)}
.lrow.done .lnum{background:var(--cc);color:#fff}
.lrow.nx .lnum{background:var(--cc);color:#fff}
.lt{display:grid;gap:1px;min-width:0}
.lt b{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.lt span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lst{color:var(--sun);font-size:13px;letter-spacing:1px;white-space:nowrap}
.lst i{font-style:normal;color:var(--line)}
.about{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink-2);background:color-mix(in srgb,var(--cc,var(--good)) 8%,var(--surface));border-radius:12px;padding:9px 11px}
.teach .about{text-align:left;font-size:14px}
.about b{color:var(--ink)}
.how{display:grid;gap:8px}.how p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.45}.how b{color:var(--ink)}
.scopes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scope{border-left:5px solid var(--cc)}
.scope:first-child{grid-column:1/-1}
.tile[disabled]{opacity:.55}
/* explore */
.extab{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.extab .el{cursor:pointer}
.exd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.exi{display:grid;gap:8px;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.etile{position:relative;width:92px;height:104px;border-radius:14px;background:var(--fc);color:var(--el-ink);display:grid;place-items:center;align-content:center;gap:0;padding:6px;text-align:center;flex:none}
.etile small{position:absolute;left:8px;top:6px;font:800 13px var(--f-display);opacity:.75}
.etile b{font:800 38px/1 var(--f-display);letter-spacing:-.02em}
.etile span{font-size:12px;font-weight:700;line-height:1.1;margin-top:3px}
.etile em{font-style:normal;font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}
.etile.big{width:118px;height:132px}
.etile.big small{font-size:15px}.etile.big b{font-size:50px}.etile.big span{font-size:14px}.etile.big em{font-size:11px}
/* play screen: table on top, answers docked to the thumb */
.play{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));overflow:hidden}
.play[hidden]{display:none}
.ptop{display:flex;align-items:center;gap:8px;padding:6px 4px;flex:none}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--good);transition:width .35s}
#pcount{font:800 14px var(--f-display);color:var(--ink-2);min-width:0;font-variant-numeric:tabular-nums}
.ptable{flex:none;padding:6px 2px 10px}
.panel{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(16,35,58,.06)}
.teach,.ask,.fin,.fill{display:grid;gap:12px;max-width:560px;margin:0 auto}
.teach{justify-items:center;text-align:center}
.eyebrow{margin:0;font:800 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.hook{margin:0;font-size:17px;line-height:1.4;font-weight:600;text-wrap:pretty}
.mnem{margin:0;font:800 23px/1.25 var(--f-display);text-wrap:balance}
.mnem u{text-decoration:none;color:var(--good)}
.mnem.small{font-size:17px;text-align:center}
.prompt{margin:0;font:700 21px/1.25 var(--f-display);text-align:center;text-wrap:balance}
.prompt b{color:var(--good)}
.sy{font-family:var(--f-display);font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:17px;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:6px 8px;line-height:1.15}
.opt .sy{font-size:24px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{display:grid;gap:10px}
.fb .yes{margin:0;text-align:center;font:800 19px var(--f-display);color:var(--good)}
.fb .yes span{display:block;font:600 14px var(--f-body);color:var(--ink-2);margin-top:2px}
.fb .no{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--bad) 9%,var(--surface));border-radius:16px;padding:10px}
.fb .no p{margin:0;font-size:14px;line-height:1.35}
.fb .no p+p{color:var(--ink-2);margin-top:4px}
.tin{display:grid;grid-template-columns:1fr auto;gap:8px}
.tin input{min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:0 14px;font:700 18px var(--f-body);color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--good)}
.fill .tin{grid-template-columns:1fr}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fstat{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.fstat b{font:800 22px var(--f-display)}
.fstat span{font:700 16px var(--f-body);color:var(--ink-2)}
.fin{text-align:center;justify-items:stretch}
.fin h2{font-size:28px;font-weight:800}
.fin .syms{justify-content:center}
.stars{display:flex;justify-content:center;gap:6px;font-size:36px;line-height:1}
.stars i{font-style:normal;color:var(--line)}
.stars i.on{color:var(--sun)}
@media (min-width:700px){.play{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}.ptable{max-width:860px;margin:0 auto;width:100%}}
@media (orientation:landscape) and (max-height:500px){.play{flex-direction:row;flex-wrap:wrap}.ptop{width:100%}.ptable{width:58%}.panel{border-radius:24px 0 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ==PREMIUM== */
/* Globetrotter design system: native iOS, refined. Shared by every tab (built in by tools/build_editions.py).
   System font (SF Pro on iPhone), iOS system colors, grouped backgrounds, App Store-style rows with drawn icons,
   translucent navigation bars, a bottom tab bar, and filled/tinted buttons. Pure restyling: no feature changes. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --f-display:var(--font); --f-body:var(--font);
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --line:rgba(60,60,67,.14); --hair:rgba(60,60,67,.18); --sep:rgba(60,60,67,.22);
  --ink:#000000; --ink-2:#6c6c72; --ink-3:#a1a1a8;
  --tint:#007aff; --tint-ink:#0063d1;
  --good:#28a745; --bad:#ff3b30; --sun:#ff9f0a; --sun-ink:#4a2a00; --hot:#ff2d55;
  --mem:#af52de; --spd:#ff9500; --log:#30b0c7; --geo:#34a853; --wd:#ff2d55; --nm:#5856d6;
  --m-learn:#5856d6; --m-prac:#28a745; --m-test:#ff9500;
  --bar:rgba(249,249,249,.86); --tabbar:rgba(249,249,249,.88);
  --elev1:0 1px 2px rgba(0,0,0,.04); --elev2:0 10px 30px -12px rgba(0,0,0,.22);
  --r-card:16px; --r-btn:14px;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --line:rgba(84,84,88,.45); --hair:rgba(84,84,88,.55); --sep:rgba(84,84,88,.6);
  --ink:#ffffff; --ink-2:#98989f; --ink-3:#636366;
  --tint:#0a84ff; --tint-ink:#409cff;
  --good:#30d158; --bad:#ff453a; --sun:#ff9f0a; --sun-ink:#3a2200; --hot:#ff375f;
  --mem:#bf5af2; --spd:#ff9f0a; --log:#40c8e0; --geo:#30d158; --wd:#ff375f; --nm:#5e5ce6;
  --m-learn:#5e5ce6; --m-prac:#30d158; --m-test:#ff9f0a;
  --bar:rgba(22,22,24,.82); --tabbar:rgba(22,22,24,.86);
  --elev1:none; --elev2:0 10px 30px -10px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --line:rgba(84,84,88,.45); --hair:rgba(84,84,88,.55); --sep:rgba(84,84,88,.6);
  --ink:#ffffff; --ink-2:#98989f; --ink-3:#636366; --tint:#0a84ff; --tint-ink:#409cff;
  --good:#30d158; --bad:#ff453a; --mem:#bf5af2; --spd:#ff9f0a; --log:#40c8e0; --geo:#30d158; --wd:#ff375f; --nm:#5e5ce6;
  --bar:rgba(22,22,24,.82); --tabbar:rgba(22,22,24,.86); --elev1:none; --elev2:0 10px 30px -10px rgba(0,0,0,.8)}

/* ---------- base ---------- */
html,body{background:var(--bg)}
body{font-family:var(--font);font-size:17px;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;color:var(--ink)}
.pg-world .home,.pg-world .screen.home{background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font);letter-spacing:-.022em}
::selection{background:color-mix(in srgb,var(--tint) 28%,transparent)}
input,textarea{caret-color:var(--tint)}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.muted{color:var(--ink-2)}
.eyebrow,.eyebrow2{font-size:13px!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink-2)!important}

/* ---------- large title + bottom tab bar ---------- */
.brand{display:block;padding:6px 4px 2px}
.brand>svg{display:none}
.brand h1{font-size:34px;font-weight:700;letter-spacing:.008em;line-height:1.2}
.pg-games #app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
.brand,.home>.brand,.wrap>.brand{animation:none!important;transform:none!important}

/* ---------- surfaces ---------- */
.card,.tile,.glist,.hcard,.mcard,.trick,.hempty,.rank,.deck,.part,.setup,.step,.res,.cpick,.mslv,.wlshape,.hlc,.tlcard,.flbonus,.mtres,.hero,.tvg,.gblist span{
  border:0!important;box-shadow:none!important;background:var(--surface);border-radius:var(--r-card)}
.card{padding:16px;gap:12px}
.card h3,.cpick h4{font-size:20px;font-weight:700;letter-spacing:-.02em}
.tile{padding:14px;border-radius:var(--r-card)}
.tile b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--ink-2)}
.chip{background:var(--surface)!important;border:0!important;box-shadow:none!important;border-radius:12px!important;font-weight:600}
.histbtn,.ib,.zbtn{background:var(--fill)!important;border:0!important;box-shadow:none!important;color:var(--tint)!important;border-radius:999px}
.ib{border-radius:10px!important}
hr{border:0;height:.5px;background:var(--sep)}

/* ---------- buttons: filled (primary), tinted (secondary), plain ---------- */
.btn{font-family:var(--font)!important;font-weight:600!important;font-size:17px!important;letter-spacing:-.02em!important;min-height:50px;border-radius:var(--r-btn)!important;border:0!important;
  background:var(--fill)!important;color:var(--tint)!important;box-shadow:none!important;filter:none!important}
.btn.go,.btn.got,.hlup,.hldn{background:var(--tint)!important;color:#fff!important}
.btn.ghost{background:transparent!important;color:var(--tint)!important;border:0!important;box-shadow:none!important;font-weight:500!important;min-height:44px}
.btn.small,.btn.sm{min-height:36px;font-size:15px!important;border-radius:999px!important;padding:0 14px}
.btn[disabled]{opacity:.35}
.btn.learn{background:color-mix(in srgb,var(--bad) 14%,transparent)!important;color:var(--bad)!important;border:0!important}
.hlup{background:var(--good)!important}.hldn{background:var(--bad)!important}
.link{color:var(--tint)}

/* ---------- navigation bars (inner screens) ---------- */
.bar,.gtop,.pbar,.ptop{background:var(--bar)!important;backdrop-filter:saturate(180%) blur(20px)!important;-webkit-backdrop-filter:saturate(180%) blur(20px)!important;border-bottom:0!important;box-shadow:0 .5px 0 var(--sep)!important}
.bar .ttl,.gtop .ttl,.ptitle{font-size:17px!important;font-weight:600!important;letter-spacing:-.02em;text-align:center}
.gtop{margin:0 -12px!important;padding:0 8px!important;min-height:50px}
.gtop::after{display:none!important}
.x{color:var(--tint)!important;background:transparent!important;width:44px;height:44px;border-radius:12px!important}
.gtop .info,.timer{background:var(--fill)!important;color:var(--ink)!important;border-radius:999px!important;padding:4px 10px!important;font-size:14px!important;font-weight:600!important;opacity:1!important;font-variant-numeric:tabular-nums}
.gtop .info:empty{display:none}
.xp,.combo,.gtop .pill{background:var(--sun)!important;color:#fff!important;box-shadow:none!important;font-family:var(--font)!important;font-weight:700!important}
.steps,.ptop .meter,.dprog,.xpbar{background:var(--fill)!important}
.steps i,.ptop .meter i,.dprog i,.xpbar i{background:var(--tint)!important}

/* ---------- inputs, segmented controls, sheets ---------- */
.cin input,.nbform input,.num input,.mf input,.backup textarea{background:var(--fill)!important;border:0!important;box-shadow:none!important;border-radius:12px!important;font-family:var(--font)!important;font-weight:500!important;color:var(--ink)}
.cin input:focus,.nbform input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 35%,transparent)!important}
.cinlist{border:0!important;border-radius:14px!important;box-shadow:var(--elev2)!important;background:var(--surface)!important;backdrop-filter:none!important}
.cinlist button{font-weight:500!important;border-top:.5px solid var(--sep)!important}
.cinlist button.on{background:var(--fill)!important}
.seg,.levels,.seg2,.seg3,.lvls,.msmode,.digits .dgs,.ops{background:var(--fill);border-radius:10px;padding:2px;gap:2px!important}
.seg button,.levels button,.seg2 button,.seg3 button,.lv,.dgs button,.op{border:0!important;background:transparent!important;box-shadow:none!important;border-radius:8px!important;color:var(--ink)!important;font-weight:600!important;font-family:var(--font)!important}
.seg button[aria-pressed="true"],.levels button[aria-pressed="true"],.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"],.lv[aria-pressed="true"],.dgs button[aria-pressed="true"],.op[aria-pressed="true"]{background:var(--surface)!important;color:var(--ink)!important;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)!important}
.op[aria-pressed="true"]{color:var(--c)!important}
.msmode span{border-radius:8px!important}
.msmode[aria-pressed="false"] span:first-child,.msmode[aria-pressed="true"] span:last-child{background:var(--surface)!important;color:var(--ink)!important;box-shadow:0 3px 8px rgba(0,0,0,.12)!important}
.sheet .in{border-radius:14px 14px 0 0!important;background:var(--surface)!important}
.sheet .sh{border-bottom:.5px solid var(--sep)!important}
.sheet .sh b{font-size:17px;font-weight:600}

/* ---------- toast: an iOS HUD capsule ---------- */
.toast{background:var(--bar)!important;color:var(--ink)!important;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  font-family:var(--font)!important;font-weight:600!important;font-size:15px!important;box-shadow:0 8px 28px -8px rgba(0,0,0,.35),0 0 0 .5px var(--sep)!important;border-radius:999px!important}
.update{background:var(--tint)!important;color:#fff!important;border-radius:14px;font-family:var(--font)!important;box-shadow:var(--elev2)}

/* ---------- results: a colored hero card ---------- */
.card.center{background:var(--c,var(--tint))!important;color:#fff;padding:26px 18px 22px!important;border-radius:20px}
.card.center .big{font-size:clamp(48px,15vw,64px)!important;font-weight:700!important;letter-spacing:-.03em!important;color:#fff!important;background:none!important;-webkit-text-fill-color:#fff;text-shadow:none!important}
.card.center p,.card.center .muted,.card.center .eyebrow,.card.center .cheer{color:rgba(255,255,255,.88)!important}
.card.center .cheer{font-size:17px!important;font-weight:600!important}
.sharerow .btn{border-radius:var(--r-btn)!important}

/* ================= GAMES ================= */
.pg-games .hero{background:linear-gradient(180deg,#1e2a4a,#121a30)!important;color:#fff;border-radius:22px!important;padding:20px!important;grid-template-columns:minmax(0,1fr) auto}
.pg-games .hero::after{display:none}
.pg-games .hero h2{font-size:28px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.1}
.pg-games .herodate{font-size:13px!important;font-weight:600;letter-spacing:0!important;text-transform:none!important;opacity:1!important;color:rgba(255,255,255,.6)}
.pg-games .herochips span{background:rgba(255,255,255,.12)!important;backdrop-filter:none;font-weight:600;font-size:13px}
.pg-games .heroplay{grid-column:1/-1;justify-self:stretch;justify-content:center;background:#fff!important;color:#0b1220!important;border:0;border-radius:var(--r-btn);min-height:50px;font-weight:600;font-size:17px;box-shadow:none!important;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.pg-games .heroplay .ic{width:22px;height:22px;color:var(--c)}
.pg-games .ring{position:relative;width:84px;height:84px}
.pg-games .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pg-games .ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.pg-games .ring .rbg{stroke:rgba(255,255,255,.14)}.pg-games .ring .rfg{stroke:#30d158;filter:none!important}
.pg-games .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1}
.pg-games .ring b small{font-size:11px;font-weight:600;color:rgba(255,255,255,.6);margin-top:3px}
.pg-games .workout{background:linear-gradient(180deg,#7b4ff2,#5a37d6)!important;box-shadow:none!important;border-radius:20px!important}
.pg-games .workout b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.pg-games .workout .steps3 span{background:rgba(255,255,255,.16)!important;font-weight:600;display:inline-flex;align-items:center;gap:6px;backdrop-filter:none}
.pg-games .workout .steps3 span.done{background:#fff!important;color:#5a37d6}
.pg-games .workout .steps3 .ic{width:16px;height:16px}
.pg-games .sech{padding:6px 4px 0}
.pg-games .sech h2{font-size:22px!important;font-weight:700!important;letter-spacing:-.02em}
.pg-games .sech span{font-size:15px;color:var(--ink-2)}
.pg-games .sech .dcount{font-size:15px!important;font-weight:500!important;color:var(--ink-2)!important}
.pg-games .sech .dcount.all{color:var(--good)!important}
.pg-games .dprog{height:4px;margin:0 4px}
.pg-games .dprog i{background:var(--good)!important}
.pg-games .glist{border-radius:var(--r-card)!important;backdrop-filter:none!important}
.pg-games .grow{grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:10px 14px;min-height:76px}
.pg-games .grow+.grow::before{left:84px;height:.5px;background:var(--sep)}
.pg-games .gi{width:56px;height:56px;border-radius:13px;font-size:0;color:#fff;text-shadow:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c))!important;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)!important;display:grid;place-items:center}
.pg-games .gi .ic{width:30px;height:30px}
.pg-games .gt b{font-size:17px!important;font-weight:600!important;letter-spacing:-.02em}
.pg-games .gt small{font-size:14px;color:var(--ink-2)}
.pg-games .gr.new,.pg-games .gr.go{background:var(--fill)!important;color:var(--tint)!important;border:0!important;box-shadow:none!important;border-radius:999px;padding:6px 18px!important;font-size:15px!important;font-weight:700!important;letter-spacing:0;text-transform:uppercase}
.pg-games .gr.done{color:var(--ink-2)!important;font-weight:600;font-size:15px}
.pg-games .gr.done i{width:22px;height:22px;background:var(--good)!important;box-shadow:none!important;color:#fff;font-size:13px}
.pg-games .gr.best{color:var(--ink)}.pg-games .gr.best small{font-family:var(--font);letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink-2)}
.pg-games .gr.chev{color:var(--ink-3)}
.pg-games .foot{color:var(--ink-3)}
/* play screen */
.gplay{background:var(--bg)!important}
.gplay::before{display:none!important}
.gplay .btn.go,.gplay .cin .btn{background:var(--tint)!important;box-shadow:none!important}
.gstage .ic{width:1.15em;height:1.15em;vertical-align:-.18em}
/* guess rows */
.wlrow>*{background:var(--surface)!important;box-shadow:none!important;border-radius:10px!important;font-weight:600!important}
.wlrow.empty>*{background:var(--fill-2)!important}
.wlrow.hit>*{background:color-mix(in srgb,var(--good) 22%,var(--surface))!important}
.wlrow .wlpct{background:linear-gradient(90deg,color-mix(in srgb,var(--good) 28%,var(--surface)) var(--p),var(--surface) var(--p))!important}
.wlrow .wlarr svg{fill:var(--tint)!important}
.wlshape{background:var(--surface)!important}
.wlshape path{fill:var(--ink)!important;stroke:var(--ink)!important}
.wlshape.won path{fill:var(--good)!important;stroke:var(--good)!important}.wlshape.lost path{fill:var(--bad)!important;stroke:var(--bad)!important}
.flbox{border-radius:14px!important;box-shadow:0 0 0 .5px var(--sep)!important}
.fltiles i{background:var(--surface-2)!important;outline:2px solid var(--bg)!important}
.flopts .btn{background:var(--surface)!important;color:var(--ink)!important}
.gmap{border-radius:14px!important;box-shadow:none!important}
.gzbtns button{background:var(--bar)!important;color:var(--ink)!important;border:0!important;box-shadow:0 0 0 .5px var(--sep)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tvg,.gblist span{background:var(--surface)!important}
.hlc{background:var(--surface)!important;padding:16px!important}
.hlflag{border-radius:8px!important;box-shadow:0 0 0 .5px var(--sep)!important}
.hlpop{color:var(--tint)!important;font-weight:700!important}
.hlvs{background:var(--fill)!important;border:0!important;box-shadow:none!important;color:var(--ink-2)}
.hlc.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface))!important}.hlc.no{background:color-mix(in srgb,var(--bad) 14%,var(--surface))!important}
.tlcur{background:var(--surface)!important;color:var(--ink)!important;box-shadow:var(--elev2)!important;border-radius:18px!important;border:0}
.tlcur small{color:var(--ink-2);opacity:1!important}
.tlcat{background:var(--fill)!important;color:var(--ink-2)!important;font-weight:600!important;text-transform:none!important;letter-spacing:0!important;font-size:12px!important}
.tlcard{border:0!important}.tly{color:var(--tint)!important;font-weight:700!important}
.tlcard.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface))!important}.tlcard.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface))!important}
.tlcard.ok .tly{color:var(--good)!important}.tlcard.no .tly{color:var(--bad)!important}
.tlslot{border:1.5px dashed color-mix(in srgb,var(--tint) 45%,transparent)!important;background:color-mix(in srgb,var(--tint) 6%,transparent)!important;color:var(--tint)!important;font-weight:600!important}
.qnboard{box-shadow:none!important;border-radius:12px!important}
.msboard{background:var(--sep)!important;box-shadow:none!important;border-radius:12px!important}
.mc{background:color-mix(in srgb,var(--log) 70%,var(--surface))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)!important;border-radius:6px!important;font-family:var(--font)!important;font-weight:700!important}
.mc.o{background:var(--surface)!important;box-shadow:none!important}
.mc.start{background:var(--good)!important}
.mc .ic{width:62%;height:62%}
.mc.boom{background:var(--bad)!important;color:#fff}
.mthead em{color:var(--ink-2)}.mthead b{font-weight:700!important}
.mschoose .mslv b{font-weight:700}
.gpbar{border-radius:12px!important}
.kb button{background:var(--surface)!important;box-shadow:0 1px 0 rgba(0,0,0,.25)!important;font-family:var(--font)!important;border-radius:6px!important}
.xwclue{border-radius:12px!important}
.cell{box-shadow:none!important;border-radius:12px!important}
.ds{border-radius:10px!important}

/* ================= MATH & TEST 3 ================= */
.pg-app .mode{background:var(--surface)!important;color:var(--ink)!important;box-shadow:none!important;border-radius:var(--r-card)!important}
.pg-app .mode b{font-size:17px!important;font-weight:600!important;color:var(--ink)}
.pg-app .mode span{color:var(--ink-2)!important;opacity:1!important}
.pg-app .mode i{background:var(--fill)!important;color:var(--ink-2)!important;font-weight:600!important;font-family:var(--font)!important}
.pg-app .mode .ic{background:var(--cc)!important;border-radius:12px!important}
.pg-math .mode{border-left:0!important;grid-template-columns:44px minmax(0,1fr) auto!important}
.pg-math .mode::before{content:"";width:44px;height:44px;border-radius:12px;grid-row:1/3;grid-column:1;background:var(--cc)}

/* ==MOTION== */
/* Motion for every tab (tools/motion.css, copied in by tools/build_editions.py).
   Rules: animate transform and opacity only; strong ease-out for anything entering; under 300 ms for UI;
   press feedback on everything tappable; nothing grows from scale(0); frequent actions stay instant;
   toasts use transitions so a second toast retargets instead of restarting; reduced motion keeps fades only. */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease:var(--ease-out)}

/* moving between tabs: a quick cross-fade instead of a white flash (browsers that support it) */
@view-transition{navigation:auto}
::view-transition-old(root){animation:vt-out 160ms var(--ease-out) both}
::view-transition-new(root){animation:vt-in 240ms var(--ease-out) both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(6px)}}

/* press feedback: everything tappable sinks a little, 160 ms */
.btn,.tile,.grow,.cbtn,.wbtn,.opt,.deck,.mode,.next,.daily,.hero,.heroplay,.workout,.mslv,.tlslot,.flopts .btn,.choices button,.seg button,.seg2 button,.seg3 button,.op,.lv,.cchip,.chip,.histbtn,.ib,.zbtn,.simp,.tpl,.hlbtns .btn,.gzbtns button,.cinlist button,.msmode{transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 200ms ease,box-shadow 200ms ease}
.btn:active,.tile:active,.cbtn:active,.wbtn:active,.opt:not([disabled]):active,.deck:active,.mode:active,.next:active,.daily:active,.heroplay:active,.workout:active,.mslv:active,.tlslot:active,.choices button:active,.seg button:active,.seg2 button:active,.seg3 button:active,.op:active,.lv:active,.cchip:active,.histbtn:active,.ib:active,.zbtn:active,.simp:active,.tpl:active,.gzbtns button:active,.msmode:active{transform:scale(.97)}
.grow:active{transform:scale(.985)}
.hero:active{transform:none}
/* keypads and game cells are pressed hundreds of times: instant, tiny feedback only */
.pad button,.kb button,.dspad button,.ckeys button,.mc,.qc,.xc,.cell{transition:transform 90ms var(--ease-out)}
.pad button:active,.kb button:active,.dspad button:active,.ckeys button:active,.mc:active,.cell:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){
  .grow:hover,.tile:hover,.cbtn:hover,.opt:not([disabled]):hover,.deck:hover,.mslv:hover{background-color:color-mix(in srgb,var(--ink) 3%,var(--surface))}
}

/* toasts: transitions, so a quick second toast retargets instead of jumping */
.toast{animation:none!important;opacity:0;transform:translateX(-50%) translateY(-10px) scale(.96);transition:opacity 180ms var(--ease-out),transform 260ms var(--ease-out)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* screens: the first view rises in once, children 40 ms apart */
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.wrap.enter>*,.gstage.enter>*{animation:rise 280ms var(--ease-out) both}
.wrap.enter>*:nth-child(2){animation-delay:40ms}.wrap.enter>*:nth-child(3){animation-delay:80ms}.wrap.enter>*:nth-child(4){animation-delay:120ms}.wrap.enter>*:nth-child(5){animation-delay:160ms}.wrap.enter>*:nth-child(n+6){animation-delay:200ms}
.gstage.enter>*>*{animation:rise 280ms var(--ease-out) both}
.gstage.enter>*>*:nth-child(2){animation-delay:40ms}.gstage.enter>*>*:nth-child(3){animation-delay:80ms}.gstage.enter>*>*:nth-child(4){animation-delay:120ms}.gstage.enter>*>*:nth-child(n+5){animation-delay:160ms}
/* home lists cascade in on first view */
.wrap.enter .glist>.grow{animation:rise 260ms var(--ease-out) both}
.wrap.enter .glist>.grow:nth-child(2){animation-delay:30ms}.wrap.enter .glist>.grow:nth-child(3){animation-delay:60ms}.wrap.enter .glist>.grow:nth-child(4){animation-delay:90ms}.wrap.enter .glist>.grow:nth-child(5){animation-delay:120ms}.wrap.enter .glist>.grow:nth-child(6){animation-delay:150ms}.wrap.enter .glist>.grow:nth-child(n+7){animation-delay:180ms}
/* World / USA / Earth home comes back with the same cascade */
.pg-world .home:not([hidden])>*{animation:rise 280ms var(--ease-out) both}
.pg-world .home:not([hidden])>*:nth-child(2){animation-delay:40ms}.pg-world .home:not([hidden])>*:nth-child(3){animation-delay:80ms}.pg-world .home:not([hidden])>*:nth-child(4){animation-delay:120ms}.pg-world .home:not([hidden])>*:nth-child(n+5){animation-delay:160ms}

/* a game opening: the play screen settles in (closing stays instant, faster than opening) */
@keyframes playin{from{opacity:0;transform:translateY(10px) scale(.985)}}
.gplay.opening,.pg-math .play.opening{animation:playin 260ms var(--ease-out) both}

/* bottom sheets (z table, t table, calculator): an iOS drawer curve */
@keyframes sheetup{from{transform:translateY(100%)}}
.sheet:not([hidden]){animation:fadein 200ms var(--ease-out) both}
.sheet:not([hidden]) .in{animation:sheetup 340ms var(--ease-drawer) both}

/* results: the score lands, the rest follows */
@keyframes land{from{opacity:0;transform:scale(.9)}}
.card.center .big{animation:land 320ms var(--ease-out) 60ms both}
/* feedback blocks and model answers appear instead of teleporting */
.fb,.model,.simple,.flbonus,.mtres,.tlcur,.tvmsg{animation:rise 220ms var(--ease-out) both}

/* guess rows (Worldle, Flagle, Statele): the newest row's tiles flip in left to right */
@keyframes tilein{from{opacity:0;transform:translateY(6px) scale(.96)}}
.wlrow.reveal>*{animation:tilein 280ms var(--ease-out) both}
.wlrow.reveal>*:nth-child(2){animation-delay:70ms}.wlrow.reveal>*:nth-child(3){animation-delay:140ms}.wlrow.reveal>*:nth-child(4){animation-delay:210ms}
/* Higher or Lower: the next challenger slides up */
.hl .hlb{animation:rise 260ms var(--ease-out) both}
/* small pops for placing things */
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.qc.qq,.mc.f{animation:pop 180ms var(--ease-out) both}
.mc.o.rv{animation:pop 220ms var(--ease-out) var(--d,0ms) both}
.gmap .mtpin{transform-box:fill-box;transform-origin:center;animation:pop 200ms var(--ease-out) both}
.gmap .mtcity{transform-box:fill-box;transform-origin:center;animation:pop 240ms var(--ease-out) 120ms both}
.tlcard.ok,.tlcard.no{animation:pop 240ms var(--ease-out) both}
.gr.done i{animation:pop 260ms var(--ease-out) both}
/* the Today ring fills in on first view */
@keyframes ringfill{from{stroke-dashoffset:var(--c0)}}
.wrap.enter .ring .rfg{animation:ringfill 700ms var(--ease-out) 150ms both}


/* ================= MOTION 2: springs, depth and continuity ================= */
:root{--ease-spring:cubic-bezier(.3,1.25,.5,1);--ease-snap:cubic-bezier(.25,1.2,.45,1)}
@supports (transition-timing-function:linear(0,1)){:root{
  --ease-spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1);
  --ease-snap:linear(0,.02 1.8%,.09 4%,.48 13%,.74 19.6%,.9 26%,1.03 34.8%,1.07 41.2%,1.08 47.5%,1.04 61%,.99 78%,1)}}

/* press and release: down fast, back with a little spring */
.btn,.tile,.grow,.cbtn,.wbtn,.opt,.deck,.mode,.next,.daily,.heroplay,.mslv,.tlslot,.flopts .btn,.choices button,.op,.lv,.chip,.histbtn,.ib,.zbtn,.simp,.tpl,.hlbtns .btn,.gzbtns button,.cinlist button,.tabbar a,.x,.gr,.levels button,.seg button,.seg2 button,.seg3 button{transition:transform 460ms var(--ease-spring),background-color 200ms ease,color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}
.btn:active,.tile:active,.cbtn:active,.wbtn:active,.opt:not([disabled]):active,.deck:active,.mode:active,.next:active,.daily:active,.heroplay:active,.mslv:active,.tlslot:active,.choices button:active,.op:active,.lv:active,.chip:active,.histbtn:active,.ib:active,.zbtn:active,.simp:active,.tpl:active,.gzbtns button:active,.cinlist button:active,.x:active{transform:scale(.96);transition:transform 90ms var(--ease-out),background-color 90ms ease}
.grow:active{transform:scale(.975);transition:transform 90ms var(--ease-out),background-color 90ms ease;background-color:color-mix(in srgb,var(--ink) 5%,var(--surface))!important}
.grow:active .gi{transform:scale(.92)}
.gi{transition:transform 460ms var(--ease-spring)}

/* the tab bar stays put while the page under it changes */
.tabbar{view-transition-name:tabbar}
::view-transition-old(tabbar),::view-transition-new(tabbar){animation:none;mix-blend-mode:normal}
::view-transition-group(tabbar){animation:none}
body .tabbar a{transition:transform 460ms var(--ease-spring),color 200ms ease}
body .tabbar a:active{transform:scale(.86);transition:transform 90ms var(--ease-out)}
.tabbar a svg{transition:transform 460ms var(--ease-spring)}
@keyframes tabpop{0%{transform:scale(.72)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.tabbar.arrived a[aria-current="page"] svg{animation:tabpop 520ms var(--ease-out) 60ms both}
.tabbar a span{transition:color 200ms ease}

/* the compact title that takes over when the large title scrolls away */
.navc{position:fixed;left:0;right:0;top:0;z-index:14;height:calc(44px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:grid;place-items:center;pointer-events:none;
  background:var(--glass,rgba(249,249,251,.82));backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:.5px solid var(--line);
  opacity:0;transition:opacity 220ms var(--ease-out)}
.navc span{font:600 17px/1 var(--f-body,-apple-system,system-ui,sans-serif);letter-spacing:-.02em;color:var(--ink);transform:translateY(6px);opacity:0;transition:transform 320ms var(--ease-out),opacity 220ms var(--ease-out)}
.navc.on{opacity:1}.navc.on span{transform:none;opacity:1}
.playing .navc,.pg-world:has(#home[hidden]) .navc{display:none}

/* opening a game or lesson: it grows out of the spot you tapped */
@keyframes zoomopen{from{opacity:0;transform:scale(.88);border-radius:28px}to{opacity:1;transform:none;border-radius:0}}
.gplay.opening,.pg-math .play.opening{transform-origin:var(--tapx,50%) var(--tapy,50%);animation:zoomopen 380ms var(--ease-drawer) both}
.pg-world #play:not([hidden]){transform-origin:var(--tapx,50%) var(--tapy,50%);animation:zoomopen 380ms var(--ease-drawer) both}
.pg-world #home:not([hidden]){animation:fadein 220ms var(--ease-out) both}

/* sections rise in as they come into view */
.sr{opacity:0;transform:translateY(22px) scale(.985)}

<body class="pg-app pg-elements">
<button class="update" id="updBtn" hidden>A new version is ready. Tap to update.</button>
<main class="wrap" id="app"></main>
<section class="play" id="play" hidden aria-label="Periodic table quiz">
  <div class="ptop"><button class="x" id="pclose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><div class="pbar"><i id="pfill"></i></div><span id="pcount"></span></div>
  <div class="ptable" id="ptable"></div>
  <div class="panel" id="panel"></div>
</section>
<script>
/* ==BACKUP== */
/* One backup for the whole app: every tab (World, USA, Earth, Math, Games, Elements) keeps its progress in this
   phone's storage under a "globetrotter." key, so one code carries all of it to a new phone.
   Codes start with GTZ1: (compressed) or GT1: (plain). Copy the code, or save it as a file. */
const GT_BK=(()=>{
  const PFX="globetrotter.";
  const b64=u8=>{ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
  const unb64=t=>{ const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
  function collect(){ const d={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PFX)) d[k]=localStorage.getItem(k); } }catch(e){} return d; }
  async function make(){
    const json=JSON.stringify({v:1,at:Date.now(),d:collect()});
    if(window.CompressionStream&&window.DecompressionStream){ try{
      const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
      return "GTZ1:"+b64(new Uint8Array(buf)); }catch(e){} }
    return "GT1:"+btoa(unescape(encodeURIComponent(json))); }
  async function read(code){
    code=String(code||"").replace(/\s+/g,""); let json;
    if(code.startsWith("GTZ1:")){ if(!window.DecompressionStream) throw new Error("old");
      json=await new Response(new Blob([unb64(code.slice(5))]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
    else if(code.startsWith("GT1:")) json=decodeURIComponent(escape(atob(code.slice(4))));
    else return null;
    const o=JSON.parse(json); if(!o||typeof o.d!=="object") throw new Error("bad"); return o; }
  function apply(o){ Object.entries(o.d).forEach(([k,v])=>{ if(k.startsWith(PFX)&&typeof v==="string") localStorage.setItem(k,v); });
    // until the page reloads, stop this tab from saving its old in-memory progress over what was just restored
    const set=Storage.prototype.setItem; Storage.prototype.setItem=function(k,v){ if(String(k).startsWith(PFX)) return; return set.call(this,k,v); }; }
  const TABS=[["globetrotter.v1","World"],["globetrotter.usa.v1","USA"],["globetrotter.earth.v1","Earth"],["globetrotter.math.v1","Math"],["globetrotter.brain.v1","Games"],["globetrotter.elements.v1","Elements"]];
  const tabsIn=d=>TABS.filter(([k])=>d[k]).map(([,n])=>n);
  const CSS=`.gtbk{display:grid;gap:10px}.gtbk .gtrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gtbk .gtpane{display:grid;gap:10px;background:var(--surface-2);border-radius:14px;padding:12px;font-size:14px;color:var(--ink-2)}
.gtbk textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:12px ui-monospace,Menlo,monospace;padding:8px;resize:vertical;box-sizing:border-box}
.gtbk .gtmsg{font-size:14px;font-weight:700;min-height:18px}.gtbk .gtmsg.ok{color:var(--good)}.gtbk .gtmsg.no{color:var(--bad)}
.gtbk .gtfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.gtbk [hidden]{display:none!important}`;
  /* the backup/restore panel; opts.legacy(code) can restore an older single-tab code */
  function ui(box,opts={}){
    if(!document.getElementById("gtbkcss")){ const st=document.createElement("style"); st.id="gtbkcss"; st.textContent=CSS; document.head.appendChild(st); }
    box.classList.add("gtbk");
    box.innerHTML=`<div class="gtrow"><button class="btn ghost" data-g="bk" type="button">Back up progress</button><button class="btn ghost" data-g="rs" type="button">Restore</button></div>
    <div class="gtpane" data-p="bk" hidden><span>One code holds your progress from every tab: World, USA, Earth, Math and Games. Keep it in Notes, email it to yourself, or save it as a file. On a new phone, open the app, tap Restore and paste it.</span>
      <textarea readonly data-t="code" aria-label="Backup code">Making your code…</textarea>
      <div class="gtrow"><button class="btn" data-g="copy" type="button">Copy code</button><button class="btn ghost" data-g="file" type="button">Save as file</button></div><span class="gtmsg" data-m="bk"></span></div>
    <div class="gtpane" data-p="rs" hidden><span>Paste a backup code, or open a backup file. It replaces the progress on this phone for the tabs in the backup.</span>
      <textarea data-t="in" placeholder="Paste code here" aria-label="Paste backup code"></textarea>
      <div class="gtrow"><button class="btn" data-g="go" type="button">Restore progress</button><button class="btn ghost" data-g="open" type="button">Open a file</button><input class="gtfile" type="file" accept=".txt,text/plain" data-t="f"></div><span class="gtmsg" data-m="rs"></span></div>`;
    const q=s=>box.querySelector(s), msg=(w,t,k)=>{ const m=q(`[data-m="${w}"]`); m.textContent=t; m.className="gtmsg "+(k||""); };
    let code="";
    const fileName=()=>{ const d=new Date(); return `globetrotter-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.txt`; };
    box.addEventListener("click",async e=>{ const b=e.target.closest("[data-g]"); if(!b) return; const g=b.dataset.g;
      if(g==="bk"){ q('[data-p="rs"]').hidden=true; const p=q('[data-p="bk"]'); p.hidden=!p.hidden; if(p.hidden) return;
        opts.beforeBackup&&opts.beforeBackup(); msg("bk","");
        code=await make(); q('[data-t="code"]').value=code;
        const tabs=tabsIn(collect()); msg("bk",tabs.length?`Includes: ${tabs.join(", ")}`:"Nothing to back up yet.","ok"); }
      if(g==="rs"){ q('[data-p="bk"]').hidden=true; const p=q('[data-p="rs"]'); p.hidden=!p.hidden; msg("rs",""); }
      if(g==="copy"){ const t=q('[data-t="code"]');
        try{ await navigator.clipboard.writeText(t.value); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy code",1500); }catch(err){ t.focus(); t.select(); msg("bk","Select all and copy the code.",""); } }
      if(g==="file"){ const blob=new Blob([code],{type:"text/plain"}), name=fileName();
        try{ const f=new File([blob],name,{type:"text/plain"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"Globetrotter backup"}); return; } }catch(err){ if(err&&err.name==="AbortError") return; }
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
        msg("bk","Saved. Look for it in your Downloads or Files.","ok"); }
      if(g==="open") q('[data-t="f"]').click();
      if(g==="go") restore(q('[data-t="in"]').value);
    });
    q('[data-t="f"]').addEventListener("change",async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const t=await f.text(); q('[data-t="in"]').value=t.trim(); restore(t); e.target.value=""; });
    async function restore(raw){
      raw=String(raw||"").trim(); if(!raw){ msg("rs","Paste a code first.","no"); return; }
      try{ const o=await read(raw);
        if(!o){ if(opts.legacy&&opts.legacy(raw)){ msg("rs","Progress restored.","ok"); return; } throw new Error("bad"); }
        const tabs=tabsIn(o.d); if(!tabs.length) throw new Error("empty");
        apply(o); msg("rs",`Restored: ${tabs.join(", ")}. Reloading…`,"ok"); setTimeout(()=>location.reload(),900); }
      catch(err){ msg("rs",err&&err.message==="old"?"This phone's browser is too old to open that code. Update iOS or Android and try again.":err&&err.message==="empty"?"That backup has no progress in it.":"That code didn't work. Copy the whole thing, starting with GTZ1: or GT1:.","no"); } }
  }
  return {make,read,apply,ui,collect};
})();
/* ==/BACKUP== */
/* ================= ELEMENTS: learn the periodic table the way the geography tabs teach the map =================
   Home is a trail of lessons, row by row. A lesson shows each new element on the table with a memory hook and a

/* where each element sits: [group column 1-18, row]. Rows 1-7 are the periods; rows 9 and 10 are the
   lanthanide and actinide rows printed under the table (row 8 is the gap). */
function cellOf(z){
  if(z===1) return [1,1]; if(z===2) return [18,1];
  if(z<=10) return z<=4?[z-2,2]:[z+8,2];
  if(z<=18) return z<=12?[z-10,3]:[z,3];
  if(z<=36) return [z-18,4]; if(z<=54) return [z-36,5];
  if(z>=57&&z<=71) return [z-54,9]; if(z>=89&&z<=103) return [z-86,10];
  if(z<=86) return z<=56?[z-54,6]:[z-68,6];
  return z<=88?[z-86,7]:[z-100,7]; }

/* families, for colors and for "which family" hints */
const FAM={alk:"Alkali metal",ear:"Alkaline earth metal",tra:"Transition metal",pst:"Post-transition metal",met:"Metalloid",non:"Nonmetal",hal:"Halogen",nob:"Noble gas",lan:"Lanthanide",act:"Actinide"};
function famOf(z){ const L=(...a)=>a.includes(z);
  if(L(3,11,19,37,55,87)) return "alk"; if(L(4,12,20,38,56,88)) return "ear"; if(L(2,10,18,36,54,86,118)) return "nob";
  if(L(9,17,35,53,85,117)) return "hal"; if(L(5,14,32,33,51,52)) return "met"; if(L(1,6,7,8,15,16,34)) return "non";
  if(z>=57&&z<=71) return "lan"; if(z>=89&&z<=103) return "act";
  if(L(13,31,49,50,81,82,83,84,113,114,115,116)) return "pst"; return "tra"; }
const periodOf=z=>z<=2?1:z<=10?2:z<=18?3:z<=36?4:z<=54?5:z<=86?6:7;
const groupOf=z=>(z>=57&&z<=71)||(z>=89&&z<=103)?null:cellOf(z)[0];

let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){ AC=null; } return AC; }
function tone(f,t0,d,v,type){ const a=AC, o=a.createOscillator(), g=a.createGain(); o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(0,a.currentTime+t0); g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.01); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d); o.connect(g).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.02); }
function snd(k){ if(!S.sound||!ac()) return;

function tableHTML(o={}){ let h=`<div class="pt ${o.cls||""}" style="${o.style||""}">`;
  for(const z of Z){ const [c,r]=cellOf(z); h+=`<button class="el f-${famOf(z)}" data-z="${z}" style="grid-column:${c};grid-row:${r}" tabindex="-1" aria-label="${esc(NAME(z))}"><small>${z}</small><b>${SYM(z)}</b><i class="w">${WT(z)}</i></button>`; }
  h+=`<span class="ph f-lan" style="grid-column:3;grid-row:6">57–71</span><span class="ph f-act" style="grid-column:3;grid-row:7">89–103</span><span class="gap" style="grid-row:8"></span>`;
  return h+`</div>`; }
const cellEl=(root,z)=>root.querySelector(`.el[data-z="${z}"]`);
// paint a table: which cells are in play, what they show, and how they're colored
function paint(root,o={}){ const pt=root.querySelector(".pt"); if(!pt) return;
  pt.classList.toggle("mastery",o.color==="mastery"); pt.classList.toggle("plain",o.color==="plain");
  for(const b of pt.querySelectorAll(".el")){ const z=+b.dataset.z;
    b.classList.toggle("dim",!!o.scope&&!o.scope.has(z));
    b.classList.toggle("blank",!!o.blank&&(o.blank===true||o.blank.has(z)));
    b.classList.toggle("hl",o.hl===z||!!(o.hlSet&&o.hlSet.has(z)));
    b.classList.toggle("cur",o.cur===z);
    b.classList.remove("ok","bad","pick");
    if(o.color==="mastery"){ const e=S.el[z]; b.dataset.m=!e||!e.n?0:e.s>=4?3:e.s>=2?2:1; } } }
function flash(root,z,cls,ms=900){ const b=cellEl(root,z); if(!b) return; b.classList.remove(cls); void b.offsetWidth; b.classList.add(cls); if(ms) setTimeout(()=>b.classList.remove(cls),ms); }
// the nearest cell to a tap, so the 2px gaps never swallow it
function cellAt(root,x,y){ let best=null, bd=1e9; for(const b of root.querySelectorAll(".el:not(.dim)")){ const r=b.getBoundingClientRect(), dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom), d=dx*dx+dy*dy; if(d<bd){ bd=d; best=b; } }
  return bd<=196?+best.dataset.z:null; }
function tile(z,big){ const f=famOf(z); return `<div class="etile f-${f} ${big?"big":""}"><small>${z}</small><b>${SYM(z)}</b><span>${esc(NAME(z))}</span><em>${esc(ELS[z-1][2])}</em></div>`; }
const where=z=>{ const g=groupOf(z), p=periodOf(z); return g?`Row ${p} · group ${g}`:`${famOf(z)==="lan"?"Lanthanide row":"Actinide row"} (row ${p})`; };

const ALT={aluminium:13,sulphur:16,caesium:55};
function nameToZ(t){ const n=norm(t); if(!n) return null; if(ALT[n]) return ALT[n]; const z=Z.find(z=>norm(NAME(z))===n); return z||null; }
function lev(a,b){ const m=a.length, n=b.length, d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
const closeEnough=(t,z)=>{ const a=norm(t), b=norm(NAME(z)); return a===b||ALT[a]===z||(b.length>=6&&lev(a,b)<=1); };
// wrong answers that teach something: neighbors on the table, look-alike symbols, lesson-mates
function distract(z,pool,kind){ const [c,r]=cellOf(z), out=new Set();
  const near=Z.filter(y=>y!==z&&Math.abs(cellOf(y)[0]-c)+Math.abs(cellOf(y)[1]-r)<=2);
  const look=Z.filter(y=>y!==z&&SYM(y)[0]===SYM(z)[0]);
  const cand=kind==="sym"?shuffle(look).concat(shuffle(near)):shuffle(near).concat(shuffle(pool||[]));
  for(const y of cand.concat(shuffle(Z))){ if(y!==z) out.add(y); if(out.size>=3) break; }
  return shuffle([z,...out]); }
// wrong numbers that are easy to confuse: one off, and the element directly above or below
function numOpts(z){ const c=[z-1,z+1,z-8,z+8,z-18,z+18,z-32,z+32,z+2,z-2].filter(n=>n>=1&&n<=118&&n!==z), out=new Set();
  for(const n of shuffle(c.slice(0,4)).concat(shuffle(c.slice(4)))){ out.add(n); if(out.size>=3) break; } return shuffle([z,...out]); }
function startSession(o){ SES=Object.assign({i:0,right:0,wrong:0,asked:0,missed:new Set(),t0:Date.now()},o);
  document.body.classList.add("playing"); play.hidden=false; ptab.innerHTML=tableHTML({cls:"play-pt"}); scrollTo(0,0); step(); }
function endSession(){ play.hidden=true; document.body.classList.remove("playing"); SES=null; home(); }
$('pclose').onclick=()=>{ if(SES&&SES.kind==="fill"){ clearInterval(SES.timer); } endSession(); };
function progress(){ const s=SES, n=s.steps.length; $('pfill').style.width=`${Math.round(s.i/n*100)}%`; $('pcount').textContent=s.kind==="daily"?`${Math.min(s.i+1,n)} / ${n}`:""; }
function step(){ const s=SES; progress(); if(s.i>=s.steps.length) return finish(); const q=s.steps[s.i]; s.q=q; s.locked=false;
  const scope=s.scope||null;
  if(q.t==="teach"){ paint(ptab,{scope,hl:q.z}); flash(ptab,q.z,"pop",700);
    const k=s.taught=(s.taught||0)+1, tot=s.steps.filter(x=>x.t==="teach").length;
    panel.innerHTML=`<div class="teach"><p class="eyebrow">New element ${k} of ${tot}</p>${tile(q.z,true)}
      <div class="facts"><span>${esc(FAM[famOf(q.z)])}</span><span>${where(q.z)}</span><span>Atomic weight ${esc(WT(q.z))}</span></div>
      <p class="hook">${esc(ELS[q.z-1][3])}</p><button class="btn go wide" id="nx">${k===tot?"See them together":"Next"}</button></div>`;
    $('nx').onclick=()=>{ const e=E(q.z); e.n++; if(!e.due) e.due=dayNo(); next(); }; return; }
  if(q.t==="mnem"){ const l=s.lesson; paint(ptab,{scope,hlSet:new Set(l.z)});
    panel.innerHTML=`<div class="teach"><p class="eyebrow">Remember them in order</p><p class="mnem">${mnemHTML(l)}</p>
      <div class="syms">${l.z.map(z=>`<span class="f-${famOf(z)}"><small>${z}</small>${SYM(z)}</span>`).join("")}</div>
      <p class="muted">Say the sentence out loud a couple of times. The capital letters are the symbols, ${UNITS[l.u].dir==="down"?"top to bottom down the column":"left to right across the row"}.</p>
      <div class="about"><b>${esc(UNITS[l.u].name)}</b> ${esc(UNITS[l.u].about)}</div>
      <button class="btn go wide" id="nx">Quiz me</button></div>`; $('nx').onclick=next; return; }
  s.asked++;
  const opts=q.t==="find"||q.t==="type"?null:q.t==="znum"||q.t==="wt"?numOpts(q.z):distract(q.z,s.pool,q.t==="sym"?"sym":"name");
  let prompt="", sub="";
  if(q.t==="find"){ paint(ptab,{scope,blank:q.blankAll?true:null}); prompt=`Tap <b>${esc(NAME(q.z))}</b>`; sub=q.blankAll?"The symbols are hidden. Go by position.":"Find it on the table."; }
  else if(q.t==="name"){ paint(ptab,{scope,hl:q.z,blank:new Set([q.z])}); prompt="Which element is glowing?"; }
  else if(q.t==="sym"){ paint(ptab,{scope,hl:q.z,blank:new Set([q.z])}); prompt=`What's the symbol for <b>${esc(NAME(q.z))}</b>?`; }
  else if(q.t==="who"){ paint(ptab,{scope,blank:new Set([q.z])}); prompt=`Which element is <b class="sy">${SYM(q.z)}</b>?`; }
  else if(q.t==="num"){ paint(ptab,{scope,blank:new Set([q.z])}); prompt=`Which element is number <b>${q.z}</b>?`; }
  else if(q.t==="type"){ paint(ptab,{scope,hl:q.z,blank:new Set([q.z])}); prompt="Type the name of the glowing element"; }
  else if(q.t==="wt"){ paint(ptab,{scope,hl:q.z}); prompt=`What's the atomic weight of <b>${esc(NAME(q.z))}</b>?`; sub="Hint: it's usually a bit more than twice the atomic number for anything past calcium."; }
  else if(q.t==="znum"){ paint(ptab,{scope,hl:q.z}); prompt=`What's the atomic number of <b>${esc(NAME(q.z))}</b>?`; sub="Count across the rows. It's also the number of protons."; }
  panel.innerHTML=`<div class="ask"><p class="prompt">${prompt}</p>${sub?`<p class="muted center">${sub}</p>`:""}
    ${opts?`<div class="opts">${opts.map(z=>`<button class="opt" data-a="${z}">${q.t==="sym"?`<b class="sy">${SYM(z)}</b>`:q.t==="znum"?`<b class="sy">${z}</b>`:q.t==="wt"?`<b class="sy">${esc(WT(z))}</b>`:esc(NAME(z))}</button>`).join("")}</div>`:""}
    ${q.t==="type"?`<form class="tin" id="tform" autocomplete="off"><input id="tin" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Element name" aria-label="Element name"><button class="btn go" type="submit">Check</button></form><button class="btn ghost small" id="idk" type="button">I don't know</button>`:""}
    <div class="fb" id="fb"></div></div>`;
  panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.a,b));
  if(q.t==="type"){ const i=$('tin'); setTimeout(()=>i.focus(),60); $('tform').onsubmit=e=>{ e.preventDefault(); const v=i.value.trim(); if(!v) return; answer(closeEnough(v,q.z)?q.z:-1,null,v); }; $('idk').onclick=()=>answer(-1,null,""); } }
function mnemHTML(l){ return esc(l.m).replace(/[A-Z]/g,m=>`<u>${m}</u>`); }
ptab.addEventListener("pointerdown",e=>{ const s=SES; if(!s||s.locked) return; const q=s.q;
  if(s.kind==="fill") return;
  if(!q||q.t!=="find") return; const z=cellAt(ptab,e.clientX,e.clientY); if(z==null) return; e.preventDefault(); answer(z,null); });
function answer(a,btn,typed){ const s=SES, q=s.q; if(s.locked) return; s.locked=true; const ok=a===q.z;
  mark(q.z,ok); if(ok) s.right++; else { s.wrong++; s.missed.add(q.z); }
  snd(ok?"ok":"no");
  paint(ptab,{scope:s.scope,hl:q.z}); flash(ptab,q.z,ok?"ok":"bad",0);
  if(q.t==="find"&&!ok&&a>0) flash(ptab,a,"pick",0);
  panel.querySelectorAll(".opt").forEach(b=>{ const z=+b.dataset.a; b.disabled=true; if(z===q.z) b.classList.add("right"); else if(b===btn) b.classList.add("wrong"); });
  const fb=$('fb');
  if(ok){ fb.innerHTML=`<p class="yes">${["Nice!","Right!","Yes!","Got it!"][Math.floor(Math.random()*4)]} <span>${SYM(q.z)} is ${esc(NAME(q.z))}, number ${q.z}${q.t==="wt"?`, weight ${esc(WT(q.z))}`:""}</span></p>`; setTimeout(next,q.t==="type"?900:750); }
  else { if(s.requeue!==false) s.steps.splice(Math.min(s.steps.length,s.i+3),0,{t:q.t==="find"&&q.blankAll?"find":q.t==="type"?"name":q.t,z:q.z,again:true});
    fb.innerHTML=`<div class="no">${tile(q.z)}<div><p><b>${q.t==="find"&&a>0?`That's ${esc(NAME(a))}. `:typed?`Not "${esc(typed)}". `:""}It's ${esc(NAME(q.z))}${q.t==="znum"?`, number ${q.z}`:q.t==="wt"?`, atomic weight ${esc(WT(q.z))}`:""}.</b></p><p>${esc(ELS[q.z-1][3])}</p></div></div><button class="btn wide" id="nx">Continue</button>`;
    $('nx').onclick=next; } }
function next(){ if(!SES||SES.kind==="fill") return; SES.i++; step(); }
function finish(){ const s=SES; practiced(); const acc=s.asked?Math.round(s.right/(s.right+s.wrong)*100):100, secs=Math.round((Date.now()-s.t0)/1000);
  let head="", extra="";
  if(s.kind==="lesson"){ const st=acc>=95?3:acc>=80?2:1, l=s.lesson; S.done[l.id]=Math.max(S.done[l.id]||0,st);
    head=`<p class="eyebrow">Lesson complete</p><h2>${esc(lessonTitle(l))}</h2><div class="stars">${[1,2,3].map(i=>`<i class="${i<=st?"on":""}">★</i>`).join("")}</div>`;
    extra=`<div class="syms">${l.z.map(z=>`<span class="f-${famOf(z)}"><small>${z}</small>${SYM(z)}</span>`).join("")}</div><p class="mnem small">${mnemHTML(l)}</p>`; }
  else if(s.kind==="daily"){ const d=today(), first=!S.daily[d]; if(first) S.daily[d]={sc:s.right,n:s.steps.length,t:secs};
    head=`<p class="eyebrow">Daily 10 · ${new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}</p><h2>${s.right} / ${s.steps.length}</h2><p class="muted">${first?`${fmt(secs)}`:`Practice run. Today's score: ${S.daily[d].sc} / ${S.daily[d].n}`}</p>`;
    extra=`<button class="btn wide" id="shr">Share</button>`; }
  else head=`<p class="eyebrow">Review done</p><h2>${s.right} of ${s.right+s.wrong} right</h2>`;
  save(); snd("done");
  const missed=[...s.missed];
  progress(); paint(ptab,{scope:s.scope,hlSet:new Set(s.kind==="lesson"?s.lesson.z:missed)});
  panel.innerHTML=`<div class="fin">${head}<div class="kv"><div><b>${acc}%</b><span>accuracy</span></div><div><b>${fmt(secs)}</b><span>time</span></div><div><b>${nLearned()}</b><span>of 118 learned</span></div></div>
    ${extra}${missed.length&&s.kind!=="lesson"?`<p class="muted">To work on: ${missed.map(z=>`<b>${SYM(z)}</b> ${esc(NAME(z))}`).join(", ")}</p>`:""}
    ${s.kind==="lesson"&&nextLesson()?`<button class="btn go wide" id="nl">Next lesson</button>`:""}<button class="btn ${s.kind==="lesson"&&nextLesson()?"ghost":"go"} wide" id="dn">Done</button></div>`;
  $('dn').onclick=endSession; if($('nl')) $('nl').onclick=()=>startLesson(nextLesson());
  if($('shr')) $('shr').onclick=()=>{ const d=S.daily[today()], txt=`Globetrotter Elements · Daily 10 · ${new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}\n${d.sc}/${d.n} in ${fmt(d.t)}${streak()>1?`\n${streak()}-day streak`:""}\n${location.origin}${location.pathname}`;
    if(navigator.share) navigator.share({text:txt}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>{ $('shr').textContent="Copied"; }); }; }
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

// a lesson: teach each new element, the memory sentence, then three kinds of questions on each plus a few old ones
function startLesson(l){ const steps=l.z.map(z=>({t:"teach",z})); steps.push({t:"mnem"});
  const rot=S.wq?["name","znum","wt","num"]:["name","znum","num"], qs=[]; l.z.forEach((z,i)=>qs.push({t:"find",z},{t:"sym",z},{t:rot[i%rot.length],z}));
  const old=shuffle(Z.filter(z=>learned(z)&&!l.z.includes(z))).sort((a,b)=>E(a).s-E(b).s).slice(0,3); old.forEach(z=>qs.push({t:Math.random()<.5?"find":"who",z}));
  startSession({kind:"lesson",lesson:l,pool:l.z,steps:steps.concat(spread(qs))}); }
function spread(qs){ // shuffle, then nudge so the same element never comes twice in a row
  let a=shuffle(qs); for(let k=0;k<30;k++){ let bad=false; for(let i=1;i<a.length;i++) if(a[i].z===a[i-1].z){ const j=Math.floor(Math.random()*a.length); [a[i],a[j]]=[a[j],a[i]]; bad=true; } if(!bad) break; } return a; }
function nextLesson(){ return LESSONS.find(l=>!S.done[l.id])||null; }
// review: what's due first, then the weakest; harder question types as an element gets stronger
function startReview(){ const due=dueList().sort((a,b)=>E(a).s-E(b).s||E(a).due-E(b).due), more=Z.filter(z=>learned(z)&&!due.includes(z)).sort((a,b)=>E(a).s-E(b).s);
  const pick=due.concat(more).slice(0,12); if(!pick.length) return;
  const qs=pick.map(z=>{ const s=E(z).s, kinds=s<=1?["find","name","sym"]:s===2?["sym","who","znum"]:s===3?["type","num","znum"]:["type","find+","num"]; if(S.wq&&s>=2) kinds.push("wt"); let t=kinds[Math.floor(Math.random()*kinds.length)];
    return t==="find+"?{t:"find",z,blankAll:true}:{t,z}; });
  startSession({kind:"review",pool:pick,steps:spread(qs)}); }
// the daily 10: the same questions for everyone on a given day
function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function startDaily(){ const r=seeded("elements-"+today()), zs=[]; while(zs.length<10){ const z=1+Math.floor(r()*118); if(!zs.includes(z)) zs.push(z); }
  const kinds=["find","name","sym","who","znum"];
  startSession({kind:"daily",steps:zs.map((z,i)=>({t:kinds[i%5],z})),requeue:false}); }

/* ================= full recall: Name them all, In order ================= */
function scopeZ(key){ if(key==="all") return Z; const u=UNITS.find(u=>u.key===key); return u.lessons.flatMap(l=>l.z).sort((a,b)=>a-b); }
const scopeName=key=>key==="all"?"All 118":UNITS.find(u=>u.key===key).name;
function startFill(kind,key){ const zs=scopeZ(key), scope=new Set(zs);
  SES={kind:"fill",mode:kind,key,zs,scope,got:new Set(),i:0,miss:0,hints:0,t0:Date.now(),steps:[0]};
  document.body.classList.add("playing"); play.hidden=false; ptab.innerHTML=tableHTML({cls:"play-pt"}); scrollTo(0,0);
  $('pfill').style.width="0%"; $('pcount').textContent="";
  panel.innerHTML=`<div class="fill"><p class="prompt" id="fp">${kind==="names"?"Type any element name":"Type the symbol for the glowing cell"}</p>
    <form class="tin" id="fform" autocomplete="off"><input id="fin" type="text" enterkeyhint="done" autocapitalize="${kind==="order"?"characters":"off"}" autocorrect="off" spellcheck="false" placeholder="${kind==="names"?"Element name":"Symbol"}" aria-label="Answer"></form>
    <div class="fstat"><b id="fcount">0 / ${zs.length}</b><span id="ftime">0:00</span></div>
    <div class="row2"><button class="btn ghost small" id="fhint" type="button">Hint</button><button class="btn ghost small" id="fgive" type="button">Give up</button></div>
    <p class="muted center" id="fnote">${kind==="names"?"Each name you get drops into its cell. Spelling counts, but British spellings are fine.":"Go in order of atomic number. Wrong letters count as misses."}</p></div>`;
  fillPaint(); const inp=$('fin'); setTimeout(()=>inp.focus(),80);
  SES.timer=setInterval(()=>{ if(SES&&SES.kind==="fill") $('ftime').textContent=fmt(Math.round((Date.now()-SES.t0)/1000)); },500);
  inp.addEventListener("input",fillInput); $('fform').onsubmit=e=>{ e.preventDefault(); fillInput(true); };
  $('fhint').addEventListener("pointerdown",e=>e.preventDefault()); $('fhint').onclick=fillHint;
  $('fgive').onclick=()=>fillDone(true); }
function fillPaint(){ const s=SES, left=new Set(s.zs.filter(z=>!s.got.has(z)));
  paint(ptab,{scope:s.scope,blank:left,cur:s.mode==="order"?s.zs[s.i]:null}); for(const z of s.got) cellEl(ptab,z).classList.add("got"); }
function fillInput(enter){ const s=SES, inp=$('fin'), v=inp.value.trim();
  if(s.mode==="names"){ const z=nameToZ(v); if(z&&s.scope.has(z)&&!s.got.has(z)){ s.got.add(z); inp.value=""; snd("pop"); fillPaint(); flash(ptab,z,"pop",600); fillCount(); }
    else if(enter===true&&v){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); } return; }
  const z=s.zs[s.i], want=SYM(z).toLowerCase(), got=v.toLowerCase();

  else if(!want.startsWith(got)){ s.miss++; inp.value=""; snd("no"); flash(ptab,z,"bad",500); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); } }
function fillCount(){ const s=SES; $('fcount').textContent=`${s.got.size} / ${s.zs.length}`; $('pfill').style.width=`${Math.round(s.got.size/s.zs.length*100)}%`; if(s.got.size===s.zs.length) fillDone(false); }
function fillHint(){ const s=SES; s.hints++; const left=s.zs.filter(z=>!s.got.has(z)); if(!left.length) return; const z=s.mode==="order"?s.zs[s.i]:left[0];

function fillDone(gave){ const s=SES; clearInterval(s.timer); practiced(); const secs=Math.round((Date.now()-s.t0)/1000), all=s.got.size===s.zs.length;

  const left=s.zs.filter(z=>!s.got.has(z));

  $('fin').blur();
  panel.innerHTML=`<div class="fin"><p class="eyebrow">${s.mode==="names"?"Name them all":"In order"} · ${esc(scopeName(s.key))}</p><h2>${all?"All of them!":`${s.got.size} of ${s.zs.length}`}</h2>
    <div class="kv"><div><b>${fmt(secs)}</b><span>time</span></div><div><b>${s.mode==="order"?s.miss:s.hints}</b><span>${s.mode==="order"?"misses":"hints"}</span></div><div><b>${S.best[bk]?fmt(S.best[bk]):"–"}</b><span>best time</span></div></div>
    ${isBest&&all?`<p class="cheer center">New best time!</p>`:""}${all&&s.hints?`<p class="muted center">Best times only count without hints.</p>`:""}
    ${left.length?`<p class="muted">Missed, in red: ${left.slice(0,30).map(z=>`<b>${SYM(z)}</b> ${esc(NAME(z))}`).join(", ")}${left.length>30?"…":""}</p>`:""}
    <button class="btn go wide" id="again">Try again</button><button class="btn ghost wide" id="dn">Done</button></div>`;
  $('dn').onclick=endSession; $('again').onclick=()=>{ const k=s.mode, key=s.key; startFill(k,key); }; }

/* ================= explore ================= */
let EX={z:1};
function explore(){ app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Back"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4 7 11l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="ttl">The periodic table</div></div>
