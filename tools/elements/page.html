<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Elements: learn the periodic table. Home is a trail of lessons row by row; play is the table on top with answers docked below. */
:root{
  --bg:#eaf4fa; --surface:#ffffff; --surface-2:#f3f8fb; --line:#d6e5ee;
  --ink:#10233a; --ink-2:#47596e; --ink-3:#8293a5;
  --sun:#ffb21e; --sun-ink:#4a3000; --good:#1fa25c; --bad:#ec5646;
  --add:#24a167; --sub:#3f67d8; --mul:#ec7f19; --div:#8b54d0; --hot:#de3f58; --pct:#0f9ea0;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1520; --surface:#12212e; --surface-2:#172938; --line:#22384a;
  --ink:#eaf3fa; --ink-2:#a8bccc; --ink-3:#6f8699;
  --sun:#ffc23f; --sun-ink:#3a2500; --good:#3cc77b; --bad:#ff7363;
  --add:#3cc485; --sub:#6b8cf0; --mul:#ff9a3d; --div:#a77ae6; --hot:#ff6680; --pct:#2cc4c4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1520; --surface:#12212e; --surface-2:#172938; --line:#22384a;
  --ink:#eaf3fa; --ink-2:#a8bccc; --ink-3:#6f8699;
  --sun:#ffc23f; --sun-ink:#3a2500; --good:#3cc77b; --bad:#ff7363;
  --add:#3cc485; --sub:#6b8cf0; --mul:#ff9a3d; --div:#a77ae6; --hot:#ff6680; --pct:#2cc4c4;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
body.playing{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:12px}
.brand h1{font-size:24px;font-weight:800}
.brand svg{flex:none}
.tabs{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{padding:7px 2px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--ink-2);text-decoration:none;text-align:center;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
/* setup card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.card h3{font-size:18px;font-weight:800}
.muted{color:var(--ink-2);font-size:14px;margin:0}
/* modes */
.mode{position:relative;overflow:hidden;border:0;border-radius:22px;padding:16px 18px;text-align:left;color:#fff;background:var(--cc);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--cc) 60%,#000 40%);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.mode b{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.mode span{font-size:14px;opacity:.92;grid-column:1}
.mode i{font-style:normal;grid-row:1/3;grid-column:2;font-family:var(--f-display);font-weight:800;font-size:14px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:grid;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-size:16px;font-weight:800}
.tile span{font-size:13px;color:var(--ink-2);line-height:1.3}
.tile .ex{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 18px;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--ink);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000 45%)}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000 40%)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;border:2px solid var(--line);font-family:var(--f-body);font-weight:700;font-size:15px;min-height:46px}
.btn.small{min-height:40px;font-size:14px;padding:0 14px}
.foot{display:grid;gap:10px;justify-items:center;font-size:12px;color:var(--ink-3);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.statrow{display:grid;grid-template-columns:28px 1fr auto auto;gap:4px 10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.statrow .o{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);text-align:center}
.statrow em{font-style:normal;color:var(--ink-2);font-size:13px}
.statrow .bar2{grid-column:2/-1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.statrow .bar2 i{display:block;height:100%;border-radius:9px;background:var(--c)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-family:var(--f-display);font-weight:800;font-size:15px;border-radius:10px;padding:5px 10px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--ink);font-variant-numeric:tabular-nums}
/* inner screens */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:calc(-14px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:17px}
/* results */
.big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.center{text-align:center}
.cheer{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--good)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:1px;text-align:center}
.kv b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--ink-2)}
/* new modes */
.mode.sm{grid-template-columns:1fr;padding:14px}
.mode.sm b{font-size:18px}.mode.sm span{font-size:13px}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg3{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.seg2 button,.seg3 button{min-height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 6px;line-height:1.2}
.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.kv{grid-template-columns:repeat(3,1fr)}

/* ================= elements ================= */
:root{--f-alk:#ffb4a6;--f-ear:#ffd49a;--f-tra:#ffe7a3;--f-pst:#cfe8b8;--f-met:#b4e4d6;--f-non:#bfe0ff;--f-hal:#cfcaff;--f-nob:#ecc9f7;--f-lan:#fbc9de;--f-act:#f5b8c4;--el-ink:#1b2430;
  --m0:var(--surface-2);--m1:#ffe3a6;--m2:#b9e6c6;--m3:#1fa25c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--f-alk:#7a3329;--f-ear:#7a5222;--f-tra:#6b5c1f;--f-pst:#3d5a2c;--f-met:#1f5a4c;--f-non:#1f4a72;--f-hal:#463e86;--f-nob:#5e2f72;--f-lan:#74304e;--f-act:#73303d;--el-ink:#f2f6fa;--m1:#6b5418;--m2:#2c6a44;--m3:#3cc77b}}
:root[data-theme="dark"]{--f-alk:#7a3329;--f-ear:#7a5222;--f-tra:#6b5c1f;--f-pst:#3d5a2c;--f-met:#1f5a4c;--f-non:#1f4a72;--f-hal:#463e86;--f-nob:#5e2f72;--f-lan:#74304e;--f-act:#73303d;--el-ink:#f2f6fa;--m1:#6b5418;--m2:#2c6a44;--m3:#3cc77b}
.f-alk{--fc:var(--f-alk)}.f-ear{--fc:var(--f-ear)}.f-tra{--fc:var(--f-tra)}.f-pst{--fc:var(--f-pst)}.f-met{--fc:var(--f-met)}.f-non{--fc:var(--f-non)}.f-hal{--fc:var(--f-hal)}.f-nob{--fc:var(--f-nob)}.f-lan{--fc:var(--f-lan)}.f-act{--fc:var(--f-act)}
/* the table */
.pt{container-type:inline-size;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(7,auto) 5px repeat(2,auto);gap:2px;width:100%}
.el{position:relative;aspect-ratio:1/1.14;border:0;padding:0;border-radius:3px;background:var(--fc);color:var(--el-ink);display:grid;place-items:center;font-family:var(--f-display);min-width:0;transition:transform .15s,background .2s,opacity .2s,box-shadow .2s}
.el b{font-size:2.85cqw;font-weight:800;line-height:1;letter-spacing:-.02em}
.el small{position:absolute;left:1px;top:0;font-size:1.45cqw;font-weight:700;opacity:.65;line-height:1.1;display:none}
@container (min-width:560px){.el small{display:block}.el b{font-size:2.5cqw;margin-top:.6cqw}}
.ph{grid-column:3;display:grid;place-items:center;border-radius:3px;background:var(--fc);opacity:.45;font:700 1.3cqw var(--f-body);color:var(--el-ink);aspect-ratio:1/1.14;overflow:hidden;white-space:nowrap}
.gap{grid-column:1/-1}
.el.dim{opacity:.18}
.el.blank b,.el.blank small{visibility:hidden}
.pt.plain .el{background:var(--surface-2)}
.pt.mastery .el{background:var(--m0);color:var(--ink-3)}
.pt.mastery .el[data-m="1"]{background:var(--m1);color:var(--el-ink)}
.pt.mastery .el[data-m="2"]{background:var(--m2);color:var(--el-ink)}
.pt.mastery .el[data-m="3"]{background:var(--m3);color:#fff}
.el.hl{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun);z-index:2;transform:scale(1.12)}
.el.hl.blank{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun),0 0 14px 4px color-mix(in srgb,var(--sun) 70%,transparent)}}
.el.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun);z-index:2;animation:glow 1.3s ease-in-out infinite}
.el.ok{background:var(--good)!important;color:#fff!important;transform:scale(1.18);z-index:3}
.el.bad{background:var(--bad)!important;color:#fff!important;z-index:3}
.el.pick{background:var(--ink-3)!important;color:#fff!important}
.el.ok b,.el.bad b,.el.pick b{visibility:visible}
.el.pop{animation:pop .6s ease}
@keyframes pop{30%{transform:scale(1.45)}}
.el.got b{visibility:visible}
.el.peek b{visibility:visible;opacity:.45}
/* home */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip small{font-weight:500;color:var(--ink-2);font-size:13px}
.next{position:relative;overflow:hidden;border:0;border-radius:22px;padding:18px;text-align:left;color:#fff;background:var(--cc);display:grid;gap:10px;box-shadow:0 6px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.next:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.next .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.9}
.next h2{font-size:27px;font-weight:800;line-height:1.05}
.next p{margin:0;font-size:15px;opacity:.92}
.next .go{justify-self:start;background:#fff;color:var(--cc);font-weight:800;border-radius:12px;padding:10px 18px;font-size:16px}
.syms{display:flex;flex-wrap:wrap;gap:6px}
.syms span{position:relative;width:46px;height:50px;border-radius:9px;display:grid;place-items:center;font:800 20px var(--f-display);background:var(--fc,rgba(255,255,255,.22));color:var(--el-ink)}
.next .syms span{color:#fff}
.syms small{position:absolute;left:4px;top:2px;font-size:10px;font-weight:700;opacity:.7}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.histbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.mini{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--fc,var(--m0));border:1px solid var(--line)}
.legend [data-m="1"]::before{background:var(--m1)}.legend [data-m="2"]::before{background:var(--m2)}.legend [data-m="3"]::before{background:var(--m3)}
.unit{border-left:6px solid var(--cc);gap:8px}
.uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ucount{font:800 14px var(--f-display);color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--surface));border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.lrow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.lrow.nx{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 7%,var(--surface))}
.lnum{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-display);background:var(--surface-2);color:var(--ink-2)}
.lrow.done .lnum{background:var(--cc);color:#fff}
.lrow.nx .lnum{background:var(--cc);color:#fff}
.lt{display:grid;gap:1px;min-width:0}
.lt b{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.lt span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lst{color:var(--sun);font-size:13px;letter-spacing:1px;white-space:nowrap}
.lst i{font-style:normal;color:var(--line)}
.how{display:grid;gap:8px}.how p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.45}.how b{color:var(--ink)}
.scopes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scope{border-left:5px solid var(--cc)}
.scope:first-child{grid-column:1/-1}
.tile[disabled]{opacity:.55}
/* explore */
.extab{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.extab .el{cursor:pointer}
.exd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.exi{display:grid;gap:8px;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.etile{position:relative;width:92px;height:104px;border-radius:14px;background:var(--fc);color:var(--el-ink);display:grid;place-items:center;align-content:center;gap:0;padding:6px;text-align:center;flex:none}
.etile small{position:absolute;left:8px;top:6px;font:800 13px var(--f-display);opacity:.75}
.etile b{font:800 38px/1 var(--f-display);letter-spacing:-.02em}
.etile span{font-size:12px;font-weight:700;line-height:1.1;margin-top:3px}
.etile em{font-style:normal;font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}
.etile.big{width:118px;height:132px}
.etile.big small{font-size:15px}.etile.big b{font-size:50px}.etile.big span{font-size:14px}.etile.big em{font-size:11px}
/* play screen: table on top, answers docked to the thumb */
.play{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));overflow:hidden}
.play[hidden]{display:none}
.ptop{display:flex;align-items:center;gap:8px;padding:6px 4px;flex:none}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--good);transition:width .35s}
#pcount{font:800 14px var(--f-display);color:var(--ink-2);min-width:0;font-variant-numeric:tabular-nums}
.ptable{flex:none;padding:6px 2px 10px}
.panel{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(16,35,58,.06)}
.teach,.ask,.fin,.fill{display:grid;gap:12px;max-width:560px;margin:0 auto}
.teach{justify-items:center;text-align:center}
.eyebrow{margin:0;font:800 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.hook{margin:0;font-size:17px;line-height:1.4;font-weight:600;text-wrap:pretty}
.mnem{margin:0;font:800 23px/1.25 var(--f-display);text-wrap:balance}
.mnem u{text-decoration:none;color:var(--good)}
.mnem.small{font-size:17px;text-align:center}
.prompt{margin:0;font:700 21px/1.25 var(--f-display);text-align:center;text-wrap:balance}
.prompt b{color:var(--good)}
.sy{font-family:var(--f-display);font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:17px;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:6px 8px;line-height:1.15}
.opt .sy{font-size:24px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{display:grid;gap:10px}
.fb .yes{margin:0;text-align:center;font:800 19px var(--f-display);color:var(--good)}
.fb .yes span{display:block;font:600 14px var(--f-body);color:var(--ink-2);margin-top:2px}
.fb .no{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--bad) 9%,var(--surface));border-radius:16px;padding:10px}
.fb .no p{margin:0;font-size:14px;line-height:1.35}
.fb .no p+p{color:var(--ink-2);margin-top:4px}
.tin{display:grid;grid-template-columns:1fr auto;gap:8px}
.tin input{min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:0 14px;font:700 18px var(--f-body);color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--good)}
.fill .tin{grid-template-columns:1fr}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fstat{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.fstat b{font:800 22px var(--f-display)}
.fstat span{font:700 16px var(--f-body);color:var(--ink-2)}
.fin{text-align:center;justify-items:stretch}
.fin h2{font-size:28px;font-weight:800}
.fin .syms{justify-content:center}
.stars{display:flex;justify-content:center;gap:6px;font-size:36px;line-height:1}
.stars i{font-style:normal;color:var(--line)}
.stars i.on{color:var(--sun)}
@media (min-width:700px){.play{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}.ptable{max-width:860px;margin:0 auto;width:100%}}
@media (orientation:landscape) and (max-height:500px){.play{flex-direction:row;flex-wrap:wrap}.ptop{width:100%}.ptable{width:58%}.panel{border-radius:24px 0 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
