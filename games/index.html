/* rules, as in the NYT game: every letter belongs to one theme word or the spangram; the spangram (yellow) touches two
   opposite sides; letters connect in any of 8 directions; any other real word of 4+ letters counts toward a hint
   (3 words = 1 hint); a hint circles one theme word's letters, and a second hint while one is showing spells out its order */
const ST_C=6, ST_R=8;
let ST_ROT=null;
const stDailyIx=()=>{ if(!ST_ROT) ST_ROT=shuf([...STRANDS.keys()],seeded("globetrotter-strands-v1")); const n=ST_ROT.length; return ST_ROT[((dayIndex()%n)+n)%n]; };
const stNum=()=>dayIndex()+1;
function stStatus(){ S.st=S.st||{}; const d=S.st[today()]; const P=STRANDS[stDailyIx()];
  return d&&d.done?`Today's done · ${d.h?`${d.h} hint${d.h>1?"s":""}`:"perfect"}`:d&&d.f&&d.f.length?`Today's #${stNum()} · ${d.f.length}/${P.w.length} found`:`Today's theme: "${P.c}"`; }
function stShare(P,st,daily){ const rows=[]; for(let i=0;i<st.o.length;i+=4) rows.push(st.o.slice(i,i+4).join(""));
  return `Strands ${daily?"#"+stNum():"(unlimited)"}\n“${P.c}”\n${rows.join("\n")}`; }
function startStrands(opt={}){
  const daily=!opt.unlimited, gid=daily?"strands":"strandsu";
  S.st=S.st||{}; const key=today();
  if(daily&&S.st[key]&&S.st[key].done) return stResults();
  const ix=daily?stDailyIx():(()=>{ const d=stDailyIx(); let k; do{ k=Math.floor(Math.random()*STRANDS.length); }while(k===d&&STRANDS.length>1); return k; })();
  const P=STRANDS[ix], words=P.w.map(([w,p])=>({w,p,sp:w===P.s})), extra=new Set(P.x?P.x.split(" "):[]);
  const st=daily?(S.st[key]=S.st[key]&&S.st[key].ix===ix?S.st[key]:{ix,f:[],o:[],hp:0,h:0,hw:-1,ho:0,nw:[]}):{ix,f:[],o:[],hp:0,h:0,hw:-1,ho:0,nw:[]};
  begin(gid,daily?`Strands #${stNum()}`:"Unlimited Strands"); stage.className="gstage scroll st-stage";
  __b.st={P,st};
  let sel=[], dragging=false, moved=false, msg="", msgCls="";
  const owner=new Array(48).fill(-1); words.forEach((w,i)=>w.p.forEach(c=>owner[c]=i));
  const persist=()=>{ if(daily) save(); };
  stage.innerHTML=`<div class="st">
    <div class="stclue"><span>Today's theme</span><b>${esc(P.c)}</b></div>
    <div class="stword" id="stw"></div>
    <div class="stboard" id="stb"><svg class="stlines" id="stl" viewBox="0 0 ${ST_C*100} ${ST_R*100}" preserveAspectRatio="none"></svg>
      ${P.g.split("").map((ch,i)=>`<div class="stc" data-i="${i}"><span>${ch}</span></div>`).join("")}</div>
    <div class="stfoot"><button class="sthint" id="sth"><i></i><span>Hint</span></button><div class="stprog" id="stp"></div></div></div>`;
  const board=$('stb'), cells=[...board.querySelectorAll(".stc")];
  const ctr=i=>[(i%ST_C)*100+50,Math.floor(i/ST_C)*100+50];
  const adj=(a,b)=>a!==b&&Math.abs(a%ST_C-b%ST_C)<=1&&Math.abs(Math.floor(a/ST_C)-Math.floor(b/ST_C))<=1;
  function lineFor(path,cls){ if(path.length<2) return ""; return `<polyline class="${cls}" points="${path.map(i=>ctr(i).join(",")).join(" ")}"/>`; }
  function render(){ const fset=new Set(st.f);
    cells.forEach((el,i)=>{ const o=owner[i], found=fset.has(o);
      el.className="stc"+(found?(words[o].sp?" span":" theme"):"")+(sel.includes(i)?" sel":"")+(!found&&st.hw===o?" hinted":"");
      const ord=!found&&st.hw===o&&st.ho?words[o].p.indexOf(i)+1:0; el.dataset.ord=ord||""; });
    $('stl').innerHTML=st.f.map(k=>lineFor(words[k].p,words[k].sp?"ln span":"ln theme")).join("")+lineFor(sel,"ln sel");
    const cur=sel.map(i=>P.g[i]).join("");
    $('stw').innerHTML=cur?`<b>${cur}</b>`:msg?`<span class="${msgCls}">${esc(msg)}</span>`:"";
    $('stp').innerHTML=`<b>${st.f.length}</b> of <b>${words.length}</b> theme words found.`;
    const hb=$('sth'), can=st.hp>=3; hb.classList.toggle("ready",can); hb.style.setProperty("--hp",Math.min(3,st.hp)/3*100+"%");
    hb.querySelector("span").textContent="Hint"; }
  function say(t,cls=""){ msg=t; msgCls=cls; render(); if(t) later(()=>{ if(msg===t){ msg=""; render(); } },1800); }
  function submit(){ const path=sel.slice(); sel=[]; if(path.length<1){ render(); return; }
    const word=path.map(i=>P.g[i]).join("");
    const k=words.findIndex(w=>w.p.length===path.length&&w.p.every((c,j)=>c===path[j]));
    if(k>=0){ if(st.f.includes(k)){ say("Already found","dim"); return; }
      st.f.push(k); st.o.push(words[k].sp?"🟡":"🔵"); if(st.hw===k){ st.hw=-1; st.ho=0; }
      good(); persist(); if(words[k].sp) say("SPANGRAM!","spang"); else say(nmCap(word.toLowerCase()),"themew");
      board.querySelectorAll(".stc").forEach(el=>{ if(words[k].p.includes(+el.dataset.i)){ el.classList.add("pop"); later(()=>el.classList.remove("pop"),450); } });
      if(st.f.length===words.length) return win(); return; }
    if(path.length<4){ say("Too short","dim"); bad(); return; }
    if(extra.has(word)||words.some(w=>w.w===word)){ if(st.nw.includes(word)){ say("Already found","dim"); return; }
      st.nw.push(word); st.hp++; persist(); tone(660,.08,"sine",.05); say(st.hp>=3&&st.hp%3===0?"Hint ready!":`${nmCap(word.toLowerCase())} · ${st.hp%3||3}/3 toward a hint`,"good"); return; }
    bad(); say("Not in word list","dim"); }
  function useHint(){ if(st.hp<3){ say(`Find ${3-st.hp} more word${3-st.hp>1?"s":""} of 4+ letters to earn a hint`,"dim"); return; }
    if(st.hw>=0&&!st.f.includes(st.hw)){ if(st.ho){ say("Find the circled word first","dim"); return; } st.ho=1; }
    else { const left=words.map((w,i)=>i).filter(i=>!st.f.includes(i)); st.hw=left.find(i=>!words[i].sp)??left[0]; st.ho=0; }
    st.hp-=3; st.h++; st.o.push("💡"); persist(); render(); }
  function win(){ st.done=1; persist(); render(); board.classList.add("won"); setTimeout(confetti,300);
    later(()=>finish(gid,st.h,{sub:`“${P.c}” · ${st.h?`${st.h} hint${st.h>1?"s":""}`:"no hints"}`, share:stShare(P,st,daily), html:stBoardCard(P,st), nextG:"strandsu", nextLabel:daily?"Play unlimited Strands":"Play again"}),1600); }
  // pointer input: drag through letters, or tap them one by one and tap the last letter again to submit
  const hit=(x,y,strict)=>{ const r=board.getBoundingClientRect(), cw=r.width/ST_C, ch=r.height/ST_R, c=Math.floor((x-r.left)/cw), rr=Math.floor((y-r.top)/ch);
    if(c<0||c>=ST_C||rr<0||rr>=ST_R) return -1; if(strict){ const dx=(x-r.left)-(c+.5)*cw, dy=(y-r.top)-(rr+.5)*ch; if(Math.hypot(dx,dy)>Math.min(cw,ch)*.42) return -1; } return rr*ST_C+c; };
  board.addEventListener("pointerdown",e=>{ const i=hit(e.clientX,e.clientY,false); if(i<0||st.done) return; e.preventDefault(); board.setPointerCapture(e.pointerId);
    dragging=true; moved=false; msg="";
    if(sel.length&&i===sel[sel.length-1]){ dragging="tapEnd"; return; }
    const at=sel.indexOf(i); if(at>=0){ sel=sel.slice(0,at+1); render(); return; }
    if(sel.length&&adj(sel[sel.length-1],i)) sel.push(i); else sel=[i]; render(); });
  board.addEventListener("pointermove",e=>{ if(!dragging) return; const i=hit(e.clientX,e.clientY,true); if(i<0) return;
    const last=sel[sel.length-1]; if(i===last) return;
    if(sel.length>1&&i===sel[sel.length-2]){ sel.pop(); moved=true; render(); return; }
    if(!sel.includes(i)&&adj(last,i)){ sel.push(i); moved=true; dragging=true; render(); } });
  const up=()=>{ if(!dragging) return; const d=dragging; dragging=false;
    if(d==="tapEnd"&&!moved){ submit(); return; } if(moved&&sel.length>1) submit(); };
  board.addEventListener("pointerup",up); board.addEventListener("pointercancel",()=>{ dragging=false; });
  $('sth').onclick=useHint;
  window._stKey=k=>{ if(k==="Enter"&&sel.length) submit(); if(k==="Escape"){ sel=[]; render(); } };
  render();
  if(st.f.length===words.length&&!st.done) win();
}
function stBoardCard(P,st){ const words=P.w.map(([w,p])=>({w,p,sp:w===P.s}));
  const ctr=i=>[(i%ST_C)*100+50,Math.floor(i/ST_C)*100+50], owner=new Array(48).fill(-1); words.forEach((w,i)=>w.p.forEach(c=>owner[c]=i));
  return `<section class="card"><h3>“${esc(P.c)}”</h3><div class="stboard mini won"><svg class="stlines" viewBox="0 0 ${ST_C*100} ${ST_R*100}" preserveAspectRatio="none">${words.map(w=>`<polyline class="ln ${w.sp?"span":"theme"}" points="${w.p.map(i=>ctr(i).join(",")).join(" ")}"/>`).join("")}</svg>${P.g.split("").map((ch,i)=>`<div class="stc ${words[owner[i]].sp?"span":"theme"}"><span>${ch}</span></div>`).join("")}</div>
    <p class="muted" style="margin-top:10px">Spangram: <b>${esc(nmCap(P.s.toLowerCase()))}</b> · ${words.filter(w=>!w.sp).map(w=>esc(nmCap(w.w.toLowerCase()))).join(", ")}</p></section>`; }
function stResults(){ const st=S.st[today()], P=STRANDS[st.ix];
  show(`${bar("Strands")}
  <section class="card center" style="--c:var(--wd)"><div class="eyebrow" style="font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)">Today's Strands #${stNum()}</div>
    <div class="big">${st.h?`${st.h} hint${st.h>1?"s":""}`:"Perfect"}</div><p class="muted">“${esc(P.c)}”</p><p class="cheer" style="color:var(--ink-2)">New theme tomorrow</p></section>
  ${stBoardCard(P,st)}
  ${SHARE_ROW}
  <button class="btn wide" data-act="play" data-g="strandsu">Play unlimited Strands</button>
  <button class="btn ghost wide" data-act="home">Home</button>`);
  wireShare(stShare(P,st,true)); }

function spark(hist,hi){ if(!hist||hist.length<2) return ""; const v=hist.slice(-12).map(h=>h.v), mx=Math.max(...v), mn=Math.min(...v), sp=(mx-mn)||1;
  const pts=v.map((x,i)=>`${(i/(v.length-1)*54+1).toFixed(1)},${(hi?17-(x-mn)/sp*16:1+(x-mn)/sp*16).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 56 18" aria-hidden="true"><polyline points="${pts}"/></svg>`; }
function bigChart(hist,g){ if(!hist||hist.length<2) return ""; const v=hist.slice(-20), W=320,H=110,L=8,T=12,B=12, vals=v.map(h=>h.v), mx=Math.max(...vals), mn=Math.min(...vals), sp=(mx-mn)||1;
  const x=i=>L+i*(W-2*L)/(v.length-1), y=val=>g.hi?T+(mx-val)/sp*(H-T-B):T+(val-mn)/sp*(H-T-B);
  return `<svg class="chart2" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your recent results">${`<polyline points="${v.map((h,i)=>`${x(i).toFixed(1)},${y(h.v).toFixed(1)}`).join(" ")}"/>`}${v.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.v)}" r="3.5"/>`).join("")}<text x="${L}" y="${H}">older</text><text x="${W-L}" y="${H}" text-anchor="end">latest</text></svg>`; }

function finish(game,v,o={}){

  const cheer=o.archive?(game==="mini"?(o.noRecord?"Solved with help. Try one clean tomorrow!":(r.better&&r.prev!=null?`New best time! Old best: ${g.fmt(r.prev)}`:r.prev!=null?`Your best: ${g.fmt(r.prev)}`:"Nice solve!")):(v===0?"Perfect: no mistakes!":"Solved!")):r.prev==null?"First score. Now beat it!":r.better?`New best! Old best: ${g.fmt(r.prev)}`:`Your best: ${g.fmt(r.prev)}`;
  show(`${bar(g.name)}
  <section class="card center" style="--c:var(${g.col||"--"+g.cat})"><div class="eyebrow" style="font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)">${esc(g.name)}</div>
    <div class="big">${esc(g.fmt(v))}</div><p class="muted">${esc(o.sub||"")}</p>${o.note?`<p class="muted">${esc(o.note)}</p>`:""}<p class="cheer" style="${r.better?"":"color:var(--ink-2)"}">${esc(cheer)}</p></section>
  ${o.html||""}
  ${(S.hist[key]||[]).length>1?`<section class="card" style="--c:var(${g.col||"--"+g.cat})"><h3>Your trend</h3>${bigChart(S.hist[key],g)}<p class="muted">${g.hi?"Higher is better.":"Lower is better."} ${S.hist[key].length} games played.</p></section>`:""}
  ${WK&&wkNext?`<button class="btn go wide" data-act="wk">Workout: next is ${esc(GAMES[wkNext].name)}</button>`:""}
  ${WK&&wkDone&&game===WK?`<section class="card center"><p class="cheer">Daily workout complete!</p><p class="muted">${dayStreak()}-day streak. Come back tomorrow.</p></section>`:""}
  ${o.share?`<div class="sharerow"><button class="btn go" id="shareB">Share result</button><button class="btn" id="copyB">Copy</button></div>`:""}
  ${o.archive?`<button class="btn wide" data-act="arch">More puzzles</button>`:`<button class="btn ${WK&&wkNext?"":"go"} wide" data-act="${o.practice?"nmp":"play"}" data-g="${o.nextG||game}">${o.nextLabel||(o.practice?"Practice round":o.daily?"Practice another":"Play again")}</button>`}
  <button class="btn ghost wide" data-act="home">Home</button>`);
  if(o.share) wireShare(o.share);
  if(o.after) o.after();
  if(o.archive) setTimeout(confetti,150); else if(WK&&wkDone&&game===WK){ setTimeout(confetti,150); toast("Workout complete!"); } else if(r.better&&r.prev!=null) setTimeout(confetti,150);
  WK=null;
}

function wireShare(text){ $('shareB').onclick=()=>shareText(text,$('shareB'));
  $('copyB').onclick=async()=>{ const t=text+"\n"+location.origin+location.pathname, b=$('copyB');
    try{ await navigator.clipboard.writeText(t); b.textContent="Copied!"; good(); setTimeout(()=>{ if(b.isConnected) b.textContent="Copy"; },1800); }
    catch(e){ if(!document.querySelector(".sharetxt")) b.parentNode.insertAdjacentHTML("afterend",`<textarea class="sharetxt" readonly rows="5">${esc(t)}</textarea>`); const ta=document.querySelector(".sharetxt"); ta.focus(); ta.select(); } }; }
const SHARE_ROW=`<div class="sharerow"><button class="btn go" id="shareB">Share result</button><button class="btn" id="copyB">Copy</button></div>`;

/* ================= HOME ================= */
function bar(title,back="home"){ return `<div class="bar"><button class="x" data-act="${back}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 4.5 7 11l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="ttl">${esc(title)}</div></div>`; }
function show(html){ app.innerHTML=html; window.scrollTo(0,0); }
const LOGO='<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M13 10.5a4 4 0 0 0-4 4 3.6 3.6 0 0 0 .6 2 4 4 0 0 0 1.4 6.4 4 4 0 0 0 7 1.6V11.6a3.5 3.5 0 0 0-5-1.1Z" fill="var(--mem)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M23 10.5a4 4 0 0 1 4 4 3.6 3.6 0 0 1-.6 2 4 4 0 0 1-1.4 6.4 4 4 0 0 1-7 1.6V11.6a3.5 3.5 0 0 1 5-1.1Z" fill="var(--log)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function bestOf(game){ if(game==="sudoku"){ const k=S.best["sudoku:daily"]!=null?"sudoku:daily":`sudoku:${S.sud}`; return {v:S.best[k],h:S.hist[k]}; }
  if(game==="lights"){ const k=`lights:${S.lit}`; return {v:S.best[k],h:S.hist[k]}; } return {v:S.best[game],h:S.hist[game]}; }
function home(){
  const w=S.work[today()]||{}, wdone=WORKOUT.filter(x=>w[x]!=null).length, st=dayStreak();
  show(`
  <div class="brand">${LOGO}<h1>Games</h1>
    <nav class="tabs" aria-label="Edition"><a href="../">World</a><a href="../usa/">USA</a><a href="../earth/">Earth</a><a href="../math/">Math</a><a href="./" aria-current="page">Games</a><a href="../test3/">Test 3</a></nav></div>
  <button class="workout" data-act="wk"><b>${wdone===3?"Workout done ✓":"Daily workout"}</b><span>${wdone===3?`Nice. ${st}-day streak. Replay any game below.`:"Three games, about four minutes: memory, speed, logic."}</span>
    <div class="steps3">${WORKOUT.map(x=>`<span class="${w[x]!=null?"done":""}">${GAMES[x].ic} ${x==="sudoku"?"Mini sudoku":esc(GAMES[x].name)}${w[x]!=null?` · ${esc(GAMES[x].fmt(w[x]))}`:""}</span>`).join("")}</div></button>
  ${st?`<div class="chips"><span class="chip hot">${st}-day streak</span><span class="chip">${S.plays} games played</span></div>`:""}
  ${CATS.map(([c,name,sub,col])=>`<section class="sec"><div class="sech"><h2>${name}</h2><span>${sub}</span></div><div class="games">${Object.entries(GAMES).filter(([k,g])=>g.cat===c).map(([k,g])=>{ const b=bestOf(k);
    return `<button class="game" style="--c:var(${g.col||col})" data-act="play" data-g="${k}"><span class="ic">${g.ic}</span><b>${esc(g.name)}</b><span>${esc(g.desc)}</span><span class="rec">${g.cat==="daily"?esc(k==="mini"||k==="groups"?wordStatus(k):k==="dsudoku"?dsStatus():k==="strands"?stStatus():k==="worldle"?wlStatus():k==="travle"?tvStatus():nmStatus(k))+(b.v!=null&&k!=="mini"&&k!=="groups"?` · best ${esc(g.fmt(b.v))}`:""):b.v!=null?`Best ${esc(g.fmt(b.v))}`:"Not played"}${g.cat==="daily"?"":spark(b.h,g.hi)}</span></button>`; }).join("")}</div></section>`).join("")}
  <button class="btn ghost wide" data-act="arch">Puzzle archive: every crossword and Connections puzzle</button>
  <section class="card"><h3>Options</h3>
    <div class="sech"><span>Mini sudoku</span></div><div class="levels">${["easy","medium","hard"].map(d=>`<button data-act="sud" data-v="${d}" aria-pressed="${S.sud===d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join("")}</div>
    <div class="sech"><span>Lights out</span></div><div class="levels">${[3,5,8].map(d=>`<button data-act="lit" data-v="${d}" aria-pressed="${S.lit===d}">${d} taps</button>`).join("")}</div></section>
  <div class="foot">
    <div>Progress saves on this device</div>
    <div id="bk" style="width:100%"></div>
    <div class="row" style="justify-content:center"><button class="btn ghost small" data-act="sound">Sounds ${S.sound?"on":"off"}</button><button class="btn ghost small" data-act="reset">Start over</button></div>
    <div>Version ${esc(APP_VERSION)}</div>
  </div>`);
  GT_BK.ui($('bk'),{beforeBackup:save});
}
const STARTERS={strands:()=>startStrands(),strandsu:()=>startStrands({unlimited:true}),worldle:()=>startWorldle(),worldleu:()=>startWorldle({unlimited:true}),travle:()=>startTravle(),travleu:()=>startTravle({unlimited:true}),diveu:()=>startNm("dive",{practice:true}),climbu:()=>startNm("climb",{practice:true}),dsudoku:startDSudoku,dive:o=>startNm("dive",o),climb:o=>startNm("climb",o),mini:startMini,groups:startGroups,seq:startSeq,num:startNum,match:startMatch,react:startReact,stroop:startStroop,schulte:startSchulte,count:startCount,sudoku:startSudoku,lights:startLights};
app.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="home") return home();
  if(a==="arch") return archive();
  if(a==="pmini") return startMini({id:+b.dataset.id});
  if(a==="pgrp") return startGroups({id:+b.dataset.id});
  if(a==="play"){ WK=null; return STARTERS[b.dataset.g](b.dataset.daily?{daily:true}:{}); }
  if(a==="wk"){ const w=S.work[today()]||{}, nx=WORKOUT.find(x=>w[x]==null); if(!nx) return; WK=nx; return STARTERS[nx](nx==="sudoku"?{daily:true}:{}); }
  if(a==="sud"){ S.sud=b.dataset.v; save(); const y=scrollY; home(); scrollTo(0,y); return; }
  if(a==="lit"){ S.lit=+b.dataset.v; save(); const y=scrollY; home(); scrollTo(0,y); return; }
  if(a==="sound"){ S.sound=!S.sound; save(); return home(); }
  if(a==="reset"){ if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Tap again to erase all Games progress"; return; } const s0=S.sound; S=FRESH(); S.sound=s0; S.nmPts=1; save(); return home(); }
});
document.addEventListener("keydown",e=>{ if(play.hidden) return; if(e.key==="Escape"){ end(); home(); return; }
  if(GS&&(GS.game==="strands"||GS.game==="strandsu")&&window._stKey&&(e.key==="Enter"||e.key==="Escape")){ e.preventDefault(); window._stKey(e.key); return; }
  if(GS&&GS.game==="dsudoku"&&window._dsKey&&!e.metaKey&&!e.ctrlKey){ if(/^[0-9nN]$/.test(e.key)||["Backspace","Delete","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){ e.preventDefault(); window._dsKey(e.key); } return; }
  if(GS&&GS.game==="mini"&&window._xwKey&&!e.metaKey&&!e.ctrlKey){ if(/^[a-z]$/i.test(e.key)||["Backspace","Tab","Enter"," ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){ e.preventDefault(); window._xwKey(e.key); } return; }
  if(GS&&GS.game==="num"&&window._numKey){ if(/^[0-9]$/.test(e.key)) window._numKey(e.key); else if(e.key==="Backspace") window._numKey("del"); else if(e.key==="Enter") window._numKey("ok"); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") save(); });

/* ---------- offline + updates (shared with the other tabs) ---------- */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("../sw.js").catch(()=>{});
async function checkUpdate(){ if(!navigator.onLine||APP_VERSION==="dev") return;
  try{ const r=await fetch("../version.json",{cache:"no-store"}); if(!r.ok) return; const v=(await r.json()).v; if(v&&v!==APP_VERSION) $('updBtn').hidden=false; }catch(e){} }
$('updBtn').onclick=async()=>{ $('updBtn').textContent="Updating…";
  try{ const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update();
    const fresh=await fetch(location.pathname+"?fresh="+Date.now(),{cache:"no-store"});
    if(fresh.ok&&window.caches){ const c=await caches.open("globetrotter-v11"); await c.put(new URL(location.pathname,location.href).href,fresh); } }catch(e){}
  location.reload(); };
setTimeout(checkUpdate,1500);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&play.hidden) checkUpdate(); });
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

home();

</script>
</body>
</html>
