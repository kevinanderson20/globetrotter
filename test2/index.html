<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Globetrotter">
<meta name="theme-color" content="#eaf4fa">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<title>640 Test 2 · Globetrotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* 640 Test 2: a study guide in the Globetrotter style. Home → Learn (flip cards) · Practice (instant feedback) · Test (timed, graded at the end). */
:root{
  --bg:#eaf4fa; --surface:#ffffff; --surface-2:#f3f8fb; --line:#d6e5ee;
  --ink:#10233a; --ink-2:#47596e; --ink-3:#8293a5;
  --sun:#ffb21e; --sun-ink:#4a3000; --good:#1fa25c; --bad:#ec5646;
  --m-learn:#3f67d8; --m-prac:#1fa25c; --m-test:#ec7f19; --t1:#8b54d0; --t2:#0f9ea0; --t3:#de3f58;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1520; --surface:#12212e; --surface-2:#172938; --line:#22384a;
  --ink:#eaf3fa; --ink-2:#a8bccc; --ink-3:#6f8699;
  --sun:#ffc23f; --sun-ink:#3a2500; --good:#3cc77b; --bad:#ff7363;
  --m-learn:#6b8cf0; --m-prac:#2fb26a; --m-test:#f28a2a; --t1:#a77ae6; --t2:#2cc4c4; --t3:#ff6680;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1520; --surface:#12212e; --surface-2:#172938; --line:#22384a;
  --ink:#eaf3fa; --ink-2:#a8bccc; --ink-3:#6f8699;
  --sun:#ffc23f; --sun-ink:#3a2500; --good:#3cc77b; --bad:#ff7363;
  --m-learn:#6b8cf0; --m-prac:#2fb26a; --m-test:#f28a2a; --t1:#a77ae6; --t2:#2cc4c4; --t3:#ff6680;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button,.bar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
/* header + edition tabs (same control as the map editions) */
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:12px}
.brand h1{font-size:24px;font-weight:800}
.brand svg{flex:none}
.tabs{order:3;flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{padding:7px 6px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);text-decoration:none;text-align:center;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
/* home */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.hero h2{font-size:22px;font-weight:800;line-height:1.15}
.hero p{margin:0;color:var(--ink-2);font-size:15px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{border-radius:14px;padding:10px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));display:grid;gap:2px;text-align:left}
.tpl b{font-family:var(--f-display);font-size:15px;color:var(--c)}
.tpl span{font-size:12px;color:var(--ink-2);line-height:1.25}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:1px}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2);line-height:1.2}
.mode{position:relative;overflow:hidden;border:0;border-radius:22px;padding:18px;text-align:left;color:#fff;background:var(--cc);display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--cc) 60%,#000 40%);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--cc) 60%,#000 40%)}
.mode .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.mode b{font-family:var(--f-display);font-size:21px;font-weight:800;display:block;line-height:1.1}
.mode span{font-size:14px;opacity:.92;display:block;margin-top:3px}
.mode i{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:15px;background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:grid;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-size:16px;font-weight:800}
.tile span{font-size:13px;color:var(--ink-2);line-height:1.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.card h3{font-size:18px;font-weight:800}
.weak{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.wrow .bar2{grid-column:1/-1;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.wrow .bar2 i{display:block;height:100%;border-radius:9px;background:var(--c,var(--good))}
.wrow em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.foot{display:grid;gap:10px;justify-items:center;font-size:12px;color:var(--ink-3);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* buttons */
.btn{border:0;border-radius:16px;min-height:52px;padding:0 18px;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--ink);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000 45%)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 55%,#000 45%)}
.btn.go{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000 40%)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;border:2px solid var(--line);font-family:var(--f-body);font-weight:700;font-size:15px;min-height:46px}
.btn.ghost:active{transform:none}
.btn.small{min-height:40px;font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.45}
.link{border:0;background:none;color:var(--ink-2);font-weight:700;font-size:14px;text-decoration:underline;padding:8px}
/* inner screens */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:calc(-14px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{flex:1;height:12px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.steps i{display:block;height:100%;width:0;background:var(--good);border-radius:9px;transition:width .3s}
.timer{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.zbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;height:38px;padding:0 10px;font-weight:800;font-size:13px;color:var(--ink-2);flex:none}
/* decks */
.deck{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;align-items:center}
.deck b{font-family:var(--f-display);font-size:17px;font-weight:800}
.deck span{font-size:13px;color:var(--ink-2)}
.deck em{font-style:normal;font-weight:800;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2}
.deck .bar2{grid-column:1/-1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.deck .bar2 i{display:block;height:100%;background:var(--m-learn);border-radius:9px}
.deck[data-done="1"] .bar2 i{background:var(--good)}
/* flip card */
.flip{min-height:min(52vh,420px);background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;transition:transform .16s ease-in}
.flip.turn{transform:rotateY(90deg)}
.flip .ft{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin:auto 0}
.flip[data-side="b"] .ft{font-size:17px;margin:0;color:var(--ink-2)}
.flip .cb{font-size:17px;line-height:1.5}
.flip .hint{font-size:13px;color:var(--ink-3);text-align:center;margin-top:auto}
.flip[data-k="1"]{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
ex{display:block;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:15px;color:var(--ink-2)}
.cnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.learn{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink);border:2px solid color-mix(in srgb,var(--bad) 45%,var(--line));box-shadow:none;font-size:16px}
.btn.got{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000 40%);font-size:16px}
.pn{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-3)}
.pn button{border:0;background:none;color:var(--ink-2);font-weight:700;padding:8px 4px;font-size:14px}
/* questions */
.qtext{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.2}
.opts{display:grid;gap:8px}
.opt{min-height:54px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left;font-weight:600;font-size:16px;line-height:1.35;transition:background .15s,border-color .15s,opacity .2s}
.opt[data-s="right"]{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
.opt[data-s="wrong"]{background:color-mix(in srgb,var(--bad) 16%,var(--surface));border-color:var(--bad);animation:shake .35s}
.opt[data-s="pick"]{border-color:var(--ink);background:var(--surface-2)}
.opt[data-s="fade"]{opacity:.45}
.opt small{display:block;font-weight:500;font-size:13px;color:var(--ink-2);margin-top:4px}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.fb{border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.45}
.fb[data-k="ok"]{background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,var(--line))}
.fb[data-k="no"]{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line))}
.fb b:first-child{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:2px 6px;margin:6px 4px 0 0}
/* problems */
.setup{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc,var(--t1));border-radius:16px;padding:14px;font-size:15.5px;display:grid;gap:8px}
.setup summary{font-weight:800;font-family:var(--f-display);font-size:15px;cursor:pointer;color:var(--ink-2)}
.dt{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin:6px 0}
.dt th,.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
.dt th{background:var(--surface-2);font-weight:700}
.dt.sm{font-size:12px}.dt.sm th,.dt.sm td{padding:4px 5px}
.tblwrap{overflow-x:auto;max-width:100%}
.part{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.part h3{font-size:17px;font-weight:800;line-height:1.25}
.part h3 .pl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:14px;margin-right:6px;vertical-align:1px}
.step{display:grid;gap:8px}
.step .sq{font-weight:700;font-size:15px}
.num{display:flex;gap:8px;align-items:stretch}
.num input,.mf input{flex:1;min-width:0;height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 18px var(--f-body);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.num input:focus,.mf input:focus{outline:none;border-color:var(--ink)}
.num input[data-s="right"],.mf input[data-s="right"]{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.num input[data-s="wrong"],.mf input[data-s="wrong"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.mf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mf label{display:grid;gap:3px;font-size:13px;font-weight:700;color:var(--ink-2)}
.mf input{height:46px;font-size:17px}
.model{background:color-mix(in srgb,var(--m-learn) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--m-learn) 35%,var(--line));border-radius:14px;padding:12px;font-size:14.5px;line-height:1.55;overflow-x:auto}
.model>b:first-child{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--m-learn);margin-bottom:4px}
.res{display:grid;gap:6px;font-size:14px}
.rline{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.rline .ok{color:var(--good);font-weight:800}.rline .no{color:var(--bad);font-weight:800}
.rline small{color:var(--ink-2)}
.big{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.check{display:grid;gap:8px}
.check label{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:15px}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--good)}
.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;align-items:center}
.hrow span{color:var(--ink-2);font-size:12px}
.hrow b{font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:4px;height:60px;padding-top:6px}
.spark i{flex:1;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--c,var(--m-test));min-height:4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font-weight:800;font-size:14px;display:grid;gap:2px}
.seg button span{font-size:11px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
/* z table sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in{background:var(--surface);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px;border-bottom:1px solid var(--line)}
.sheet .sh b{flex:1;font-family:var(--f-display);font-size:17px}
.sheet .zsel{padding:8px 16px;font-size:14px;color:var(--ink-2);min-height:36px}
.sheet .zsel b{color:var(--ink)}
.ztab{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 6px 10px}
.ztab table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin:0 auto}
.ztab th,.ztab td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
.ztab thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.ztab tbody th{position:sticky;left:0;background:var(--surface)}
.ztab td.hl,.ztab th.hl{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.ztab td.on{background:var(--sun);color:var(--sun-ink);font-weight:800}
.update{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:50;max-width:calc(100% - 32px);border:0;border-radius:14px;padding:12px 16px;background:var(--sun);color:var(--sun-ink);font:700 15px/1.3 var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.muted{color:var(--ink-2);font-size:14px;margin:0}
.center{text-align:center}
/* grids never grow past the screen: wide tables scroll inside their own box */
.part,.card,.setup,.step,.hero,.res{grid-template-columns:minmax(0,1fr);min-width:0}
.wrap>*{min-width:0}
.wrap>:not(.bar){max-width:100%}
.setup>div,.model{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* positive reinforcement */
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--good) 10%,transparent) 30%,color-mix(in srgb,var(--good) 45%,transparent) 100%)}
.flash.on{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);z-index:61;background:var(--good);color:#fff;font:800 17px var(--f-display);padding:10px 18px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.18);opacity:0;pointer-events:none;white-space:nowrap}
.toast.on{animation:toast 1.8s ease-out}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.9)}12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.06)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:62;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.streak{display:inline-block;background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good);border-radius:999px;padding:1px 8px;font-weight:800;letter-spacing:0;text-transform:none}
.cheer{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--good)}
/* plain-English explainer on cards */
.flip{position:relative}
.simp{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:999px;height:34px;padding:0 10px 0 8px;font-size:13px;font-weight:700}
.simp[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.flip[data-side="f"] .eyebrow,.flip[data-side="b"] .ft{padding-right:96px}

</div></div>
<script>
/* ================= 640 TEST 2 CONTENT =================
   Everything the study guide teaches lives here. Source: the BUAN 640 Test 2 tutor kit
   and the posted practice test with solutions. Edit freely: the app reads these arrays.
   OBJ   learning objectives (code -> short name)
   DECKS concept decks for Learn mode; each card has f (front) and b (back, simple HTML)
   QC    quick checks for Practice and Test (a = index of the right option, o = objective codes)
*/
const OBJ={
  P1:"Sample spaces & random experiments", P2:"Valid probability assignments", P3:"Addition & complement rules",
  P4:"Mutually exclusive vs independent", P5:"Multiplication rule",
  D1:"Random variables, discrete vs continuous", D2:"Valid discrete distribution", D3:"Expected value, variance, SD",
  D4:"Binomial assumptions", D5:"Binomial probabilities",
  C1:"Continuous: P(single value) = 0", C4:"Normal table lookups", C5:"z-scores & percentiles", C6:"Normal model in business"
};

const DECKS=[
{id:"basics", title:"The building blocks", sub:"Experiments, events, random variables", cards:[
 {f:"Random experiment", b:"Any process whose result is uncertain before it happens.<ex>Selecting one car at random from a list; inspecting five units from a production line; recording tomorrow's demand.</ex>"},
 {f:"Random event", b:"A set of possible outcomes of a random experiment: a statement that turns out <b>true or false</b> once the experiment is run.<ex>\"The selected car has at least four stars.\" \"All five units pass inspection.\" \"Demand exceeds 500 units.\"</ex>"},
 {f:"Random variable", b:"A <b>rule that assigns a number</b> to each possible outcome of a random experiment. Before the experiment runs it has no particular value; it has a <b>distribution</b>, which says how probable each value is.<ex>The number of stars of the selected car; the number of defective units among five; tomorrow's demand in units.</ex>"},
 {f:"Realization", b:"The particular value the random variable takes once the experiment has run. The random variable is the rule; the realization is the number it produced this time.<ex>X = stars of a randomly selected car. The car we pick has 4 stars, so 4 is a realization of X.</ex>"},
 {f:"How do events and random variables connect?", b:"Any statement about the value of X defines an event: {X = 5}, {X ≥ 4}, {60 < X < 70}. So P(X ≥ 4) is just the probability of an event, and all the probability rules apply unchanged.<ex>{X = 4} and {X = 5} are mutually exclusive (X can't take two values at once), so their probabilities can be added.</ex>"},
 {f:"X versus x", b:"Capital <b>X</b> is the random variable (the rule). Lowercase <b>x</b> is one particular number X might take. P(X = x) reads \"the probability that X takes the value x\". In p(x) = ..., x is a placeholder you replace with a number, as in P(X = 4).<ex>Capitals near the start (A, B) usually name events; capitals near the end (X, Y, Z) name random variables; n and p are given constants; μ and σ are the mean and SD.</ex>"},
 {f:"Discrete vs continuous", b:"<b>Discrete:</b> the values can be listed (counts, ratings on a fixed scale).<br><b>Continuous:</b> any value in an interval (weight, time, a score modeled as continuous).<br>Decide by the <b>set of values X can take</b>, and give a one-sentence reason.<ex>Model answer: \"X assumes a finite number of values (specifically, 5), and therefore it is discrete.\"</ex>"},
 {f:"Why is P(X = 70) = 0 for a continuous X?", b:"For a continuous variable, probability is <b>area under the density curve over an interval</b>, and a single point has no width. P(69.5 < X < 70.5) is positive; P(X = 70) is 0.<ex>So for a normal X, P(X > 70) = P(X ≥ 70). For a binomial X, {X > 3} and {X ≥ 3} are different events with different probabilities.</ex>"}
]},
{id:"table", title:"Distribution from a table", sub:"Template 1: build it, check it, use it", cards:[
 {f:"Build a distribution from a table of counts", b:"Divide each count by the total. Show how each probability was obtained.<ex>100 cars: 0, 4, 18, 59, 19 cars with 1 to 5 stars → P(x) = 0, 0.04, 0.18, 0.59, 0.19.</ex>"},
 {f:"When is a distribution valid?", b:"Check <b>both</b> conditions:<br>1. Every probability is between 0 and 1.<br>2. The probabilities sum to 1.<ex>0.2, 0.3, 0.4, 0.2 sums to 1.1, so it is not valid, even though each value is between 0 and 1.</ex>"},
 {f:"Translate the event before computing", b:"Turn the words into values of X first. For a discrete X the boundary matters:<br>\"more than 2\" excludes 2 · \"at least 2\" includes 2<br>\"fewer than 5\" excludes 5 · \"at most 5\" includes 5<ex>P(X < 4) = P(X = 1) + P(X = 2) + P(X = 3) = 0 + 0.04 + 0.18 = 0.22</ex>"},
 {f:"Why may you add P(X = 3) and P(X = 4)?", b:"Because the events {X = 3} and {X = 4} are <b>mutually exclusive</b>: X cannot take two values at once. Not \"because the trials are independent\"; that is a common error."},
 {f:"Expected value: formula", b:"E[X] = Σ x · p(x) (not on the formula sheet, so memorize it).<ex>E[X] = 1(0) + 2(0.04) + 3(0.18) + 4(0.59) + 5(0.19) = 3.93</ex>"},
 {f:"What is the expected value?", b:"The <b>probability-weighted average</b> of the values of X: the center of the distribution. It does not have to be a value X can take.<ex>3.93 stars is not a possible rating. Like 1.9 children per family: no family has 1.9 children.</ex>"},
 {f:"Interpret E[X] (full credit)", b:"Do three things: say it is an <b>average</b>; say <b>what it is averaged over</b>; use the <b>context and units</b>.<br>• Fixed set, one drawn at random: \"An average rating of a car in this set is 3.93 stars.\"<br>• Repeated experiment: \"If this experiment were repeated infinitely many times, on average the expert would correctly identify 4.4 matches out of 5.\"<ex>Never: \"X will be 3.93\", \"3.93 is the most likely value\", \"we expect 3.93\" in the everyday sense.</ex>"},
 {f:"Interpretation: what loses points?", b:"<b>Partial:</b> \"on average, 4.4 matches\" with no hint of what the average is over.<br><b>No credit:</b> \"the expert will identify 4.4 matches\", \"is expected to get 4.4 right\", \"4.4 is the most likely number\". Each treats E[X] as a prediction of one result, and a count can't even be 4.4."},
 {f:"Variance: say it from memory", b:"Var(X) = E[(X − E[X])²]: the <b>expected value of the squared difference</b> between X and its expected value. Roughly, <b>the average squared deviation from the average</b>.<br>Compute: Var(X) = Σ (x − E[X])² · p(x)."},
 {f:"Why square the deviations?", b:"Plain deviations always average to <b>zero</b>: values above and below E[X] cancel. Squaring makes every deviation count and weighs big ones more. Price: variance is in <b>squared units</b>."},
 {f:"Standard deviation", b:"SD(X) = √Var(X). It brings the spread back to the <b>units of X</b> and describes a typical distance between X and E[X]. Show the work (a table of deviations is fine) and state the units.<ex>Var = 0.5251 → SD = √0.5251 = 0.7246 stars</ex>"},
 {f:"Variance table layout", b:"Columns: x · P(x) · x − E[X] · (x − E[X])² · P(x)(x − E[X])². Add the last column for Var(X), then take the square root.<ex>Stars: 0 + 0.1490 + 0.1557 + 0.0029 + 0.2175 = 0.5251</ex>"}
]},
{id:"binom", title:"Binomial", sub:"Template 2: recognize it, justify it, compute", cards:[
 {f:"The four binomial assumptions", b:"1. A <b>fixed number n</b> of identical trials<br>2. <b>Two outcomes</b> per trial (success / failure)<br>3. The <b>same probability p</b> of success in every trial<br>4. <b>Independent</b> trials<br>Find where the problem states each one."},
 {f:"Full-credit binomial justification", b:"Define X in words, name the structure, give the parameters:<ex>\"Let X = number of correct matches out of 5. Since this random variable can be represented as a number of successes in n identical independent trials, X ~ B(5, 0.88).\"</ex>"},
 {f:"Justification: what loses points?", b:"<b>Partial:</b> X ~ B(5, 0.88) with no reason, or the formula used with no distribution named.<br><b>No credit:</b> \"binomial because there are two outcomes\" alone, or \"because it's a probability problem\". Independence and constant p are the assumptions that usually fail in practice."},
 {f:"The binomial formula", b:"p(x) = C(n, x) · p<sup>x</sup> · (1 − p)<sup>n − x</sup>, where C(n, x) = n! / (x!(n − x)!). On the formula sheet, with E[X] = np and Var(X) = np(1 − p).<ex>P(X = 4) = 5!/(4!·1!) · 0.88⁴ · 0.12 = 5 · 0.5997 · 0.12 ≈ 0.3598</ex>"},
 {f:"Where does the formula come from?", b:"Each sequence of successes and failures is an elementary event; its probability is a product by the <b>multiplication rule</b> (the trials are independent). The <b>binomial coefficient</b> counts how many sequences give the same value of X."},
 {f:"Binomial coefficients you'll need", b:"C(5,3) = 5!/(3!·2!) = 10 (not 5 × 3).<ex>C(4,1)=4 · C(4,2)=6 · C(5,1)=5 · C(5,2)=10 · C(5,3)=10 · C(5,4)=5 · C(6,1)=6 · C(6,2)=15 · C(6,3)=20 · C(n,0)=C(n,n)=1</ex>"},
 {f:"Independent trials vs mutually exclusive values", b:"Both appear in every binomial problem, and they are not the same.<br><b>Independence</b> justifies <b>multiplying</b> across trials inside each term.<br><b>Mutual exclusivity</b> justifies <b>adding</b> P(X = 3) + P(X = 4) across values.<ex>Two mutually exclusive events with positive probability are never independent: learning one happened tells you the other didn't.</ex>"},
 {f:"\"Exactly one mistake out of 5\"", b:"If X counts <b>correct</b> identifications, one mistake means 4 correct: <b>X = 4</b>, not X = 1. Always convert failures into the count X tracks."},
 {f:"\"More than 2 but less than 5\"", b:"Both inequalities are strict: X = 3 or 4.<ex>P(2 < X < 5) = P(X = 3) + P(X = 4) = 0.0981 + 0.3598 = 0.4579</ex>"},
 {f:"\"At least 1\": the shortcut", b:"The complement of \"at least one\" is \"none\": P(X ≥ 1) = 1 − P(X = 0)."},
 {f:"Binomial expected value", b:"E[X] = np, interpreted as the average number of successes over many repetitions of the same experiment.<ex>E[X] = 5 × 0.88 = 4.4: \"if this experiment were repeated infinitely many times, on average the expert would correctly identify 4.4 matches out of 5.\"</ex>"},
 {f:"Service level and stockout risk", b:"With s units (or seats) on hand and demand X:<br><b>Service level</b> = P(X ≤ s)<br><b>Stockout risk</b> = P(X > s)<ex>6 tickets sold for 5 seats, each passenger shows with p = 0.9: overbooked means X = 6, P = 0.9⁶.</ex>"},
 {f:"Looks binomial but isn't", b:"• Sampling <b>without replacement</b> from a small group (trials not independent)<br>• <b>p changes</b> from trial to trial (big vs small clients)<br>• <b>No fixed n</b> (customers arriving in an hour, umbrellas sold in a day)<br>• Linked trials: employees of one store, members of one household"}
]},
{id:"normal", title:"Normal", sub:"Template 3: z-scores, table, percentiles", cards:[
 {f:"z-score", b:"z = (x − μ) / σ: how many standard deviations x lies above (+) or below (−) the mean. Round to two decimals for the table. Not on the formula sheet.<ex>(70 − 50)/15 = 1.33: a rating of 70 is 1.33 SDs above the mean.</ex>"},
 {f:"What the table gives", b:"The area to the <b>LEFT</b> of z, for z from 0.00 to 3.09. Not the area between 0 and z, and not the area to the right.<ex>Row 1.3, column 0.03 → P(Z < 1.33) = 0.9082</ex>"},
 {f:"Area ABOVE a value", b:"Use the complement: P(Z > z) = 1 − P(Z < z).<ex>P(X > 70) = 1 − P(Z < 1.33) = 1 − 0.9082 = 0.0918 → about 9.18% of employees rate above 70.</ex>"},
 {f:"Area BETWEEN two values", b:"Subtract the two left areas: P(a < X < b) = P(X < b) − P(X < a).<ex>P(60 < X < 70) = 0.9082 − 0.7486 = 0.1596</ex>"},
 {f:"Negative z with a positive-only table", b:"Use symmetry: P(Z < −z) = 1 − P(Z < z).<ex>P(Z < −1.33) = 1 − 0.9082 = 0.0918. And P(Z > −1.33) = P(Z < 1.33) = 0.9082.</ex>"},
 {f:"Cutoff / percentile questions", b:"1. Say which percentile: \"lowest rating in the top 10%\" = <b>90th percentile</b>.<br>2. Find the closest table probability and its z.<br>3. x = μ + zσ, with numbers.<br>4. Round in context if it must be whole.<ex>Closest to 0.9 is 0.8997 at z = 1.28 → x = 50 + 1.28 × 15 = 69.2 → 69</ex>"},
 {f:"Bottom k% cutoff", b:"The highest value in the bottom 10% is the <b>10th percentile</b>, below the mean, so z is negative. Find the z for 0.90 (1.28) and flip the sign: z = −1.28, then x = μ − 1.28σ."},
 {f:"Reorder point for a service level", b:"A 95% service level means stock covers lead-time demand 95% of the time, so the reorder point is the <b>95th percentile</b> of lead-time demand: P(demand ≤ ROP) = 0.95."},
 {f:"Not in the table? Don't interpolate", b:"Use the closest table probability and its z, and say which one you used. If two are equally close, either is fine.<ex>0.95 lies between 0.9495 (1.64) and 0.9505 (1.65): use either and say which.</ex>"},
 {f:"Common table lookups", b:"0.90 → z = 1.28 (0.8997)<br>0.95 → 1.64 or 1.65<br>0.975 → 1.96 (0.9750)<br>0.99 → 2.33 (0.9901)<br>0.80 → 0.84 (0.7995)<br>0.75 → 0.67 (0.7486)"},
 {f:"\"Above 70\" vs \"70 or above\"", b:"For a <b>normal</b> X they are the same, because P(X = 70) = 0. For a <b>binomial</b> X they are different events."},
 {f:"When does the normal model fit?", b:"\"Approximately normal\" works when nearly all the probability falls inside the possible range. Ratings 1 to 100 with μ = 50, σ = 15: the range is more than 3σ from the mean on both sides.<ex>Bad fits: waiting times, incomes, claim sizes (skewed, bounded at zero). Hold time with μ = 2, σ = 3 min gives P(X < 0) = 0.2514.</ex>"},
 {f:"Finish in context", b:"End with a sentence about the problem, not just a number.<ex>\"Approximately 9.18% of employees have a rating above 70.\"</ex>"}
]},
{id:"spot", title:"Spot the template", sub:"Recognize the structure under a new story", cards:[
 {f:"The test in one sentence", b:"<b>One written problem</b>, very similar in structure to one of the three practice problems, in a new context. Closed book, calculator only. Formula sheet and normal table provided. Graded on reasoning, justification and interpretation, not only the number."},
 {f:"Signature: Template 1 (table)", b:"A table of counts or percentages for a numerical variable with a few values; one unit drawn at random, or one period treated as random. <b>No named distribution:</b> the table is the distribution. Asks for the distribution, a range probability, E[X], SD."},
 {f:"Signature: Template 2 (binomial)", b:"A fixed number n of repeated trials, two outcomes each, the same probability every time, independent. X counts successes.<ex>Signal phrases: \"each ... independently\", \"out of n\", \"assume the same probability for every ...\"</ex>"},
 {f:"Signature: Template 3 (normal)", b:"A measurement that can take any value in an interval, stated to be (approximately) normal with a given mean and SD. Asks for proportions above, below, between, or a value cutting off a proportion."},
 {f:"Typical Template 1 stories", b:"Items per online order · cars sold per day · satisfaction ratings 1 to 5 · service calls per day · walk-in rooms per night · returns per week · credit cards per applicant"},
 {f:"Typical Template 2 stories", b:"Defectives in a sample from a large run · coupon redemptions · on-time deliveries · loan defaults · first-contact resolutions · flight no-shows (overbooking) · survey responses · offers accepted"},
 {f:"Typical Template 3 stories", b:"Package fill weights · part lengths or diameters · lead-time demand and reorder points · delivery times on a fixed route · daily line output · aptitude test scores"}
]},
{id:"grading", title:"How you're graded", sub:"What a full-credit answer shows", cards:[
 {f:"1. Define X in words first", b:"Say what it counts or measures before using it.<ex>\"Let X = number of correct matches out of 5.\"</ex>Probabilities about an X you never defined make an incomplete answer."},
 {f:"2. Translate the event into values of X", b:"\"At least 4 correct\" → X ≥ 4 → X = 4 or X = 5. Do this before computing."},
 {f:"3. Expression, numbers, result", b:"Write the expression, then substitute, then the result. A bare number is not an answer.<ex>P(X = 4) = 5!/(4!·1!) · 0.88⁴ · 0.12 = 5 · 0.5997 · 0.12 ≈ 0.3598</ex>"},
 {f:"4. Discrete or continuous, with a reason", b:"Decide by the set of values X can take, in one sentence."},
 {f:"5. Show where the distribution came from", b:"Count ÷ total for each value. If asked whether it's valid, check both: each between 0 and 1, and the sum is 1."},
 {f:"6. Justify the binomial", b:"Name the structure (successes in n identical independent trials with the same p), then X ~ B(n, p) with numbers."},
 {f:"7. Interpret E[X]", b:"Average + what it's averaged over + context and units. Never \"X will be ...\" or \"most likely\"."},
 {f:"8. SD with work and units", b:"Compute from the variance with the work shown; state it in the units of X."},
 {f:"9. Normal probabilities", b:"z with the formula shown (2 decimals), quote the table value, show how you got the area (complement, difference, or symmetry)."},
 {f:"10. Percentile / cutoff", b:"Name the percentile, quote the closest table probability and its z, compute x = μ + zσ with numbers, round in context."},
 {f:"11. Finish in context, round right", b:"Final line goes back to the story. Probabilities to 4 decimals, z to 2 decimals, unless the question says otherwise."}
]},
{id:"errors", title:"Common traps", sub:"The mistakes most students make first", cards:[
 {f:"Trap: X never defined", b:"Writing P(X ≥ 4) without saying what X is. Define it in words first."},
 {f:"Trap: wrong boundary", b:"Including 2 in \"more than 2\", excluding 4 from \"at least 4\", reading \"exactly one mistake\" as X = 1."},
 {f:"Trap: E[X] as a prediction", b:"\"Will be\" or \"most likely\". E[X] is an average over repetitions or over the set."},
 {f:"Trap: variance as plain average deviation", b:"Or as \"the square of the mean\". The plain average deviation is always zero."},
 {f:"Trap: forgetting the square root", b:"Reporting the variance as the SD, or giving the variance in the units of X."},
 {f:"Trap: binomial with no reason", b:"Or calling it binomial when trials aren't independent, p changes, or there's no fixed n."},
 {f:"Trap: adding because of independence", b:"Adding P(X = 3) + P(X = 4) is justified by <b>mutual exclusivity</b>. Independence justifies multiplying inside each term."},
 {f:"Trap: botched binomial coefficient", b:"C(5,3) is 10, not 5 × 3 = 15. Don't drop it when it isn't 1."},
 {f:"Trap: misreading the table", b:"The table gives area to the LEFT of z. Not between 0 and z, not to the right."},
 {f:"Trap: forgetting the complement", b:"Reporting P(Z < 1.33) = 0.9082 when the question asks for the area above (0.0918)."},
 {f:"Trap: cutoff left as a z-score", b:"Convert back: x = μ + zσ. Watch the sign for bottom-tail cutoffs."},
 {f:"Trap: negative z in a positive table", b:"Use symmetry, P(Z < −z) = 1 − P(Z < z)."},
 {f:"Trap: number with no story", b:"No expression, or no closing sentence in context."}
]},
{id:"formulas", title:"Formulas", sub:"What's given and what you must know", cards:[
 {f:"Given on the test", b:"P(Aᶜ) = 1 − P(A)<br>P(A or B) = P(A) + P(B) − P(A and B)<br>Mutually exclusive: P(A or B) = P(A) + P(B)<br>P(A|B) = P(A and B)/P(B)<br>Binomial p(x), E[X] = np, Var(X) = np(1 − p)<br>Standard normal table (area to the left)"},
 {f:"Memorize: expected value", b:"E[X] = Σ x · p(x)"},
 {f:"Memorize: variance and SD", b:"Var(X) = Σ (x − E[X])² · p(x)<br>SD(X) = √Var(X)"},
 {f:"Memorize: z both ways", b:"z = (x − μ)/σ<br>x = μ + zσ"},
 {f:"Memorize: tails and symmetry", b:"P(Z > z) = 1 − P(Z < z)<br>P(Z < −z) = 1 − P(Z < z)"}
]},
{id:"examples", title:"Posted practice test", sub:"The three problems with model answers", cards:[
 {f:"Stars Q1(a): 100 cars, X = stars (1 to 5). Discrete or continuous?", b:"X assumes a finite number of values (specifically, 5), and therefore it is discrete."},
 {f:"Stars Q1(b): counts 0, 4, 18, 59, 19. Distribution?", b:"We have 100 observations, so divide each count by 100:<br>x: 1, 2, 3, 4, 5<br>P(x): 0, 0.04, 0.18, 0.59, 0.19"},
 {f:"Stars Q1(c): P(X < 4)?", b:"P(X < 4) = P(X = 1) + P(X = 2) + P(X = 3) = 0 + 0.04 + 0.18 = 0.22"},
 {f:"Stars Q1(d): E[X] and interpretation", b:"E[X] = Σ x P(x) = 1×0 + 2×0.04 + 3×0.18 + 4×0.59 + 5×0.19 = 3.93<br>An average rating of a car in this set is 3.93 stars."},
 {f:"Stars Q1(e): SD of X", b:"Deviations −2.93, −1.93, −0.93, 0.07, 1.07; squared × P(x): 0, 0.1490, 0.1557, 0.0029, 0.2175.<br>Var(X) = 0.5251; SD = √0.5251 = 0.7246 stars"},
 {f:"Fingerprints Q2(a): 88% correct, 5 pairs. P(all five correct)?", b:"Let X = number of correct matches out of 5. Since X is a number of successes in n identical independent trials, X ~ B(5, 0.88).<br>P(X = 5) = 0.88⁵ = 0.5277"},
 {f:"Fingerprints Q2(b): exactly one mistake?", b:"One mistake = 4 correct.<br>P(X = 4) = 5!/(4!·1!) · 0.88⁴ · 0.12 = 5 · 0.88⁴ · 0.12 = 0.3598"},
 {f:"Fingerprints Q2(c): at least 4 correct?", b:"\"At least 4\" includes 4.<br>P(X ≥ 4) = P(X = 4) + P(X = 5) = 0.3598 + 0.5277 = 0.8875"},
 {f:"Fingerprints Q2(d): more than 2 but less than 5?", b:"P(2 < X < 5) = P(X = 3) + P(X = 4)<br>P(X = 3) = 5!/(3!·2!) · 0.88³ · 0.12² = 10 · 0.88³ · 0.12² = 0.0981<br>= 0.0981 + 0.3598 = 0.4579"},
 {f:"Fingerprints Q2(e): E[X] and interpretation", b:"E[X] = np = 5 × 0.88 = 4.4<br>If this experiment were repeated infinitely many times, on average the expert would correctly identify 4.4 matches out of 5."},
 {f:"Ratings Q3(a): N(50, 15). Lowest \"exemplary\" (top 10%) rating?", b:"Top 10% → 90th percentile. Closest table probability to 0.9 is 0.8997 at z = 1.28.<br>x = μ + zσ = 50 + 1.28 × 15 = 69.2, about 69 if whole numbers."},
 {f:"Ratings Q3(b): % above 70?", b:"z = (70 − 50)/15 = 1.33; table: 0.9082.<br>P(X > 70) = 1 − P(Z < 1.33) = 1 − 0.9082 = 0.0918<br>About 9.18% of employees rate above 70."},
 {f:"Ratings Q3(c): % between 60 and 70?", b:"P(X < 70) = 0.9082; z = (60 − 50)/15 = 0.67 → 0.7486.<br>P(60 < X < 70) = 0.9082 − 0.7486 = 0.1596, about 16% of employees."}
]}
];

/* Quick checks. q = question, c = choices, a = right index, e = why, o = objectives.

const SIMPLE={
basics:[
 "Anything where you don't know the result until it happens. Like flipping a coin, or waiting to see how many customers walk in today.<ex>Rolling a die is a random experiment. You know it will be 1 to 6, but not which.</ex>",
 "A yes/no statement about the result. After the experiment, it either happened or it didn't.<ex>Roll a die. \"I rolled an even number\" is an event: it's true for 2, 4, 6 and false for 1, 3, 5.</ex>",
 "A way of turning each result into a number. It's the question \"how many?\" or \"how much?\" you ask about the experiment.<ex>Flip 3 coins. X = number of heads. Results like HTH become the number 2.</ex>",
 "The actual number you got this time. X is the question; the realization is today's answer.<ex>X = customers who walk in today. Today 37 came in, so 37 is the realization.</ex>",
 "Any statement like \"X is at least 4\" is a yes/no event, so you can find its probability with normal probability rules.<ex>X = goals in a game. \"X = 0\" (a shutout) and \"X ≥ 3\" (a big game) are both events.</ex>",
 "Big X = the question (\"how many sales today?\"). Small x = a specific possible answer (like 3). P(X = 3) means \"chance the answer turns out to be 3\".<ex>Think of X as a blank on a form and x as what might get written in it.</ex>",
 "Can you count the possible values (0, 1, 2, ...)? Discrete. Could it be any number in a range, with decimals forever (2.3817... seconds)? Continuous.<ex>Number of texts you get today: discrete. How long your commute takes: continuous.</ex>",
 "With continuous things, \"exactly\" is infinitely precise. The chance someone is exactly 70.000000... inches tall is zero; there's only a chance of being in a range, like 69.5 to 70.5.<ex>That's why for a normal variable, \"above 70\" and \"70 or more\" give the same answer.</ex>"
],
table:[
 "Probability = how many had that value ÷ how many there are in total.<ex>20 of 100 students got an A, so P(A) = 20/100 = 0.20.</ex>",
 "Two checks: no probability below 0 or above 1, and they all add up to exactly 1 (something has to happen).<ex>Weather: 0.5 sun, 0.3 cloud, 0.3 rain adds to 1.1. Impossible, so it's not valid.</ex>",
 "Before doing math, write which numbers count. \"Fewer than 4\" means 1, 2, 3 (not 4). \"At least 4\" means 4, 5 (4 counts).<ex>\"At least 18 to vote\": 18 counts. \"Over 18\": 18 doesn't.</ex>",
 "X can't be 3 and 4 at the same time, so \"3 or 4\" has no overlap, and you just add the chances.<ex>A die can't land on 2 and 5 at once, so P(2 or 5) = 1/6 + 1/6.</ex>",
 "Multiply each value by its probability, then add them all up. It's a weighted average.<ex>A game pays $10 with chance 0.2 and $0 with chance 0.8: E = 10(0.2) + 0(0.8) = $2.</ex>",
 "It's the long-run average, not a value you'll actually see.<ex>The average family has 1.9 kids. No family has 1.9 kids, but the average still makes sense.</ex>",
 "Say three things: (1) it's an average, (2) average over what (this set of cars, or many repeats), (3) the units.<ex>\"An average rating of a car in this set is 3.93 stars.\" Average ✓, over this set ✓, stars ✓.</ex>",
 "Saying \"on average 4.4\" without saying over what loses some points. Saying it \"will be\" 4.4 or \"most likely\" 4.4 loses all of them.<ex>You can't get 4.4 fingerprints right. That's the giveaway that E[X] isn't a prediction.</ex>",
 "Variance measures how spread out the values are: how far from the average they typically land, squared.<ex>Two classes both average 75. Class A: everyone got 73 to 77 (small variance). Class B: scores from 40 to 100 (big variance).</ex>",
 "If you just averaged \"how far above or below\", the pluses and minuses cancel to zero every time. Squaring makes them all positive.<ex>Scores of 70 and 80 around an average of 75: deviations −5 and +5 add to 0. Squared: 25 + 25 = 50.</ex>",
 "Variance is in squared units (stars²), which is weird. The square root puts it back in normal units.<ex>SD = 0.72 stars means a typical car is about 0.72 stars away from the 3.93 average.</ex>",
 "Make a table, one row per value: subtract the average, square it, multiply by its probability. Add the last column. Square-root at the end.<ex>Columns: x · P(x) · x − E · (x − E)² · P(x)(x − E)²</ex>"
],
binom:[
 "Binomial = repeat the same yes/no thing a set number of times, same odds each time, and no attempt affects another.<ex>Shoot 5 free throws, 70% each, misses don't affect the next shot: binomial.</ex>",
 "Say what X counts, say why it's binomial (n identical, independent trials, same chance), then write B(n, p).<ex>\"X = free throws made out of 5. Number of successes in 5 identical independent trials, so X ~ B(5, 0.7).\"</ex>",
 "\"It's binomial\" with no reason only gets partial credit. \"Two outcomes\" alone isn't enough, because independence and same-chance are what usually break.",
 "The formula: (how many arrangements) × (chance of a success)^(successes) × (chance of failure)^(failures).<ex>2 heads in 3 flips: 3 arrangements (HHT, HTH, THH) × 0.5² × 0.5¹ = 0.375.</ex>",
 "One specific order (like HHT) has probability p × p × (1 − p). The coefficient counts how many orders give the same total.<ex>Getting exactly 1 six in 3 rolls can happen 3 ways: first, second or third roll.</ex>",
 "C(n, x) = how many ways to choose which x trials are the successes. Use n!/(x!(n − x)!).<ex>C(5,2): 5!/(2!·3!) = 120/(2·6) = 10. Not 5 × 2.</ex>",
 "Independent: one trial doesn't affect another (so multiply). Mutually exclusive: two things can't both happen (so add).<ex>Two coin flips are independent. \"X = 3\" and \"X = 4\" are mutually exclusive. Different ideas, both used here.</ex>",
 "Always count what X counts. If X counts correct ones and there was 1 mistake out of 5, then 4 were correct.<ex>Out of 5 penalty kicks, \"exactly one miss\" = 4 goals.</ex>",
 "\"More than 2\" doesn't include 2. \"Less than 5\" doesn't include 5. So only 3 and 4 count.<ex>Ages \"over 12 and under 15\": 13 and 14.</ex>",
 "\"At least one\" is the opposite of \"none\". So compute the chance of none and subtract from 1.<ex>Chance at least one of 4 texts gets a reply = 1 − (chance none do).</ex>",
 "E[X] = n × p. Read it as the average if you repeated the whole thing over and over.<ex>Flip 10 coins: E = 10 × 0.5 = 5 heads on average, over many sets of 10 flips.</ex>",
 "Service level = chance you have enough. Stockout risk = chance demand is more than you have.<ex>8 seats, 9 tickets sold: overbooked only if all 9 show up, P(X = 9).</ex>",
 "If the odds change between tries, or there's no fixed number of tries, it's not binomial.<ex>Drawing 3 cards from a deck without putting them back: the odds shift each draw. Not binomial.</ex>"
],
normal:[
 "z tells you how many standard deviations away from average something is. Positive = above, negative = below.<ex>Average height 66 in, SD 3. Someone 72 in tall: z = (72 − 66)/3 = 2, two SDs above average.</ex>",
 "Every number in the table is the share of the bell curve to the LEFT of your z (below it).<ex>z = 0 → 0.5000: half the curve is below the average.</ex>",
 "Table gives \"below\". For \"above\", do 1 minus the table number.<ex>If 90.82% are below, then 100% − 90.82% = 9.18% are above.</ex>",
 "Between two values = (share below the bigger one) − (share below the smaller one).<ex>Below 70: 90.82%. Below 60: 74.86%. Between: 15.96%.</ex>",
 "The bell curve is a mirror. The share below −1.33 is the same as the share above +1.33.<ex>P(Z < −1.33) = 1 − 0.9082 = 0.0918.</ex>",
 "Here you're given a percentage and asked for a value. Go backwards: find the % inside the table, read off z, then x = average + z × SD.<ex>Top 10% means 90% are below → find 0.90 in the table → z = 1.28 → x = 50 + 1.28 × 15 = 69.2.</ex>",
 "For a bottom cutoff, your answer is below average, so z is negative.<ex>Bottom 10%: z = −1.28. x = 50 − 1.28 × 15 = 30.8.</ex>",
 "Service level 95% = enough stock 95% of the time = the value with 95% of demand below it.<ex>So the reorder point is the 95th percentile of demand.</ex>",
 "If the exact number isn't in the table, use the closest one. No in-between math needed.<ex>0.95 is between 0.9495 and 0.9505. Pick either z (1.64 or 1.65) and say which.</ex>",
 "Memorize these and you'll save time on cutoff questions.<ex>Top 10% → 1.28 · top 5% → 1.64 or 1.65 · top 2.5% → 1.96 · top 1% → 2.33</ex>",
 "For smooth (continuous) things, landing on one exact number has zero chance, so \"above\" and \"at or above\" are the same.<ex>For counts (binomial), \"more than 3\" and \"at least 3\" are different.</ex>",
 "The bell curve only makes sense if nearly everything fits in the possible range. Waiting times can't go below 0 and are lopsided, so a bell curve fits badly.<ex>Hold time mean 2 min, SD 3: a bell curve would say 25% of calls have negative wait times. Nonsense.</ex>",
 "Your final line should be a sentence a manager could read.<ex>\"About 9.18% of employees rate above 70.\" Not just \"0.0918\".</ex>"

const rnd=n=>Math.floor(Math.random()*n);

function makeCounts(k,N){
  for(let tries=0;tries<200;tries++){

    for(let i=0;i<k;i++) w.push(Math.max(.15, 1-Math.abs(i-peak)*(.28+Math.random()*.25))+Math.random()*.3);
    const small=Math.random()<.5?0:k-1; w[small]=Math.random()<.35?0:.04+Math.random()*.06;

    if(c.every(x=>x>=0)&&c.filter(x=>x>0).length>=k-1&&new Set(c).size>=k-1) return c;
  }
  return Array(k).fill(N/k);
}

    model:`<table class="dt sm"><tr><th>x</th><th>P(x)</th><th>x − E[X]</th><th>(x − E[X])²</th><th>P(x)(x − E[X])²</th></tr>${vals.map((x,i)=>`<tr><td>${x}</td><td>${fnum(P[i])}</td><td>${fnum(dev[i])}</td><td>${f4(sq[i])}</td><td>${f4(prod[i])}</td></tr>`).join("")}</table>Var(X) = ${prod.map(f4).join(" + ")} = ${f4(V)}<br>SD(X) = √${f4(V)} = ${f4(SD)} ${ctx.unit}`}

     const c4=numOpts(zf.z,[zf.z+.01*(1+rnd(3)),-zf.z,r2(P),zf.z-.1],x=>x.toFixed(2));
     return {q:`Which z has about ${Math.round(P*1000)/10}% of the area to its LEFT?`, c:c4.map(x=>x.toFixed(2).replace("-","−")), a:0, e:`Find the probability closest to ${P} inside the table: ${f(zf.t)} at z = ${zf.z.toFixed(2)}${zf.alt!=null?` (or ${zf.alt.toFixed(2)})`:""}.`, o:["C4","C5"]}; }
   let q,ans,e;
   if(kind==="below"){ q=`P(Z < ${zs}) = ?`; ans=t; e=`Read row ${zs.slice(0,3)}, column 0.0${zs[3]}: the table gives area to the left.`; }
   else if(kind==="above"){ q=`P(Z > ${zs}) = ?`; ans=r4(1-t); e=`Complement: 1 − ${f(t)} = ${f(1-t)}.`; }
   else if(kind==="negbelow"){ q=`P(Z < −${zs}) = ?`; ans=r4(1-t); e=`Symmetry: P(Z < −${zs}) = 1 − P(Z < ${zs}) = 1 − ${f(t)} = ${f(1-t)}.`; }
   else { q=`P(Z > −${zs}) = ?`; ans=t; e=`Symmetry: the area right of −${zs} equals the area left of ${zs}: ${f(t)}.`; }
   const c4=numOpts(ans,[r4(1-ans), ZT[Math.min(30,r+1)][c], r4(t-.5), ZT[r][(c+1)%10]],f);
   return {q, c:c4.map(f), a:0, e, o:["C4"]}; }},
 coef:{title:"Binomial pieces", sub:"C(n, x), powers and the setup", gen(){
   const kind=pick(["c","c","c","setup"]);
   if(kind==="c"){ const n=4+rnd(3), x=1+rnd(n-1), v=C(n,x);
     const c4=numOpts(v,[n*x, fact(n)/fact(x), x===1?n+1:C(n,x-1)+ (C(n,x-1)===v?1:0), v+n],x=>String(x));
     return {q:`C(${n}, ${x}) = ?`, c:c4.map(String), a:0, e:`${n}!/(${x}!·${n-x}!) = ${fact(n)}/(${fact(x)}·${fact(n-x)}) = ${v}. Not ${n} × ${x}.`, o:["D5"]}; }
   const n=4+rnd(3), x=1+rnd(n-1), p=pick([.1,.2,.3,.7,.8,.9,.85,.75]), q=r2(1-p);
   const ok=`${C(n,x)} × ${p}${sup(x)} × ${q}${sup(n-x)}`;
   return {q:`X ~ B(${n}, ${p}). Which expression is P(X = ${x})?`, c:uniqOpts(ok,[`${n*x} × ${p}${sup(x)} × ${q}${sup(n-x)}`, `${C(n,x)} × ${p}${sup(n-x)} × ${q}${sup(x)}`, `${p}${sup(x)} × ${q}${sup(n-x)}`]), a:0, e:`C(${n}, ${x}) = ${C(n,x)}, then p to the number of successes (${x}) and 1 − p to the number of failures (${n-x}).`, o:["D5","P5"]}; }}
};

</script>
<script>
/* ================= 640 TEST 2 APP ================= */
const APP_VERSION="2026.10.31-1431";
const LS="globetrotter.test2.v1";
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const TPL={1:{name:"Table",long:"Distribution from a table",c:"--t1"},2:{name:"Binomial",long:"Binomial",c:"--t2"},3:{name:"Normal",long:"Normal",c:"--t3"}};

/* ---------- saved progress ---------- */
let S={cards:{}, qc:{}, sess:0, obj:{}, tests:[], sound:true, pr:{}, drills:{}, days:[]};
try{ const raw=localStorage.getItem(LS); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function rec(objs,ok){ (objs||[]).forEach(o=>{ const s=S.obj[o]||(S.obj[o]={r:0,w:0}); ok?s.r++:s.w++; }); }

/* ---------- sound: the same small bell and soft thud as the map editions ---------- */
let actx=null;
function snd(kind){ if(!S.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime;
    if(kind==="ok"){ const out=actx.createGain(); out.gain.value=.55; out.connect(actx.destination);
      [[1,1,1.1],[2.0,.45,.7],[2.76,.32,.45],[5.4,.14,.25]].forEach(([r,a,d])=>{ const os=actx.createOscillator(), gg=actx.createGain();
        os.type="sine"; os.frequency.value=1046.5*r; os.connect(gg); gg.connect(out);
        gg.gain.setValueAtTime(.0001,t); gg.gain.exponentialRampToValueAtTime(.09*a,t+.004); gg.gain.exponentialRampToValueAtTime(.0001,t+d);
        os.start(t); os.stop(t+d+.05); }); return; }
    const o=actx.createOscillator(), g=actx.createGain(); o.connect(g); g.connect(actx.destination);
    o.type="triangle"; o.frequency.setValueAtTime(196,t); o.frequency.exponentialRampToValueAtTime(130,t+.15);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.11,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.start(t); o.stop(t+.24);
  }catch(e){} }
/* positive reinforcement: bell + green flash on every right answer, a callout on streaks, confetti on perfect rounds */
let STK=0;
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function buzz(ok,streak=true){ snd(ok?"ok":"no"); try{ navigator.vibrate&&navigator.vibrate(ok?12:[20,40,20]); }catch(e){}
  if(!ok){ if(streak) STK=0; return; }
  flash(); if(!streak) return; STK++;
  if(STK===3) toast("3 in a row!"); else if(STK===5) toast("5 in a row. You're on fire!"); else if(STK%10===0) toast(`${STK} in a row. Unstoppable!`); }
function flash(){ const f=$('flash'); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); }
const praise=()=>pick(["Right!","Exactly.","Nailed it.","Yes!","Correct.","Spot on."]);
function confetti(){ if(reduceMotion) return; const box=$('confetti'); box.innerHTML="";
  const cols=["var(--good)","var(--sun)","var(--m-learn)","var(--t3)","var(--t2)","var(--t1)"];
  for(let i=0;i<70;i++){ const e=document.createElement("i"); e.style.left=Math.random()*100+"%"; e.style.background=cols[i%cols.length];
    e.style.setProperty("--dx",(Math.random()*160-80)+"px"); e.style.setProperty("--r",(Math.random()*720-360)+"deg");
    e.style.animationDelay=Math.random()*.35+"s"; e.style.animationDuration=1.4+Math.random()*1.1+"s"; box.appendChild(e); }
  setTimeout(()=>{ box.innerHTML=""; },3200); }
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function studied(){ const t=dstr(new Date()); S.days=S.days||[]; if(S.days[S.days.length-1]!==t){ S.days.push(t); S.days=S.days.slice(-90); } }
function dayStreak(){ const set=new Set(S.days||[]); let d=new Date(), n=0; if(!set.has(dstr(d))) d=new Date(Date.now()-864e5);
  while(set.has(dstr(d))){ n++; d=new Date(d.getTime()-864e5); } return n; }

/* ---------- timer ---------- */
let tick=null, t0=0;
function startTimer(){ stopTimer(); t0=Date.now(); tick=setInterval(()=>{ const el=$('timer'); if(el) el.textContent=fmtT((Date.now()-t0)/1000); },1000); }
function stopTimer(){ if(tick) clearInterval(tick); tick=null; return Math.round((Date.now()-t0)/1000); }
const fmtT=s=>{ s=Math.round(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

/* ---------- icons ---------- */
const IC={
 x:'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
 back:'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 4.5 7 11l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 learn:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="13" height="16" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 3h9a3 3 0 0 1 3 3v12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M7.5 11h6M7.5 15h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
 prac:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="2"/><path d="m8 12.3 2.7 2.7L16.3 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 test:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 9.5v4l2.5 2M9.5 3h5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
 logo:'<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M6 27c5 0 6-15 12-15s7 15 12 15" fill="none" stroke="var(--m-learn)" stroke-width="3" stroke-linecap="round"/><path d="M6 28.5h24" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="27" cy="9" r="3.5" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/></svg>'
};
function bar(title,opts={}){ return `<div class="bar"><button class="x" data-act="${opts.back||"home"}" aria-label="Back">${opts.close?IC.x:IC.back}</button>${opts.prog!=null?`<div class="steps"><i style="width:${opts.prog*100}%"></i></div>`:`<div class="ttl">${esc(title)}</div>`}${opts.z?'<button class="zbtn" data-act="ztable">z table</button>':""}${opts.timer?'<span class="timer" id="timer">0:00</span>':""}</div>`; }
function show(html){ app.innerHTML=html; window.scrollTo(0,0); }

/* ---------- derived stats ---------- */
const ALLCARDS=DECKS.flatMap(d=>d.cards.map((c,i)=>({...c, deck:d.id, dt:d.title, key:d.id+":"+i})));
function cardStats(d){ const cs=d?ALLCARDS.filter(c=>c.deck===d):ALLCARDS; return {n:cs.length, got:cs.filter(c=>S.cards[c.key]===1).length, learning:cs.filter(c=>S.cards[c.key]===0).length}; }
function accuracy(){ let r=0,w=0; Object.values(S.obj).forEach(o=>{ r+=o.r; w+=o.w; }); return r+w?r/(r+w):null; }
function weakObjs(){ return Object.entries(S.obj).filter(([k,o])=>o.r+o.w>=3).map(([k,o])=>({k, a:o.r/(o.r+o.w), n:o.r+o.w})).filter(o=>o.a<.85).sort((a,b)=>a.a-b.a).slice(0,3); }
const bestExam=()=>{ const e=S.tests.filter(t=>t.k==="exam"); return e.length?Math.max(...e.map(t=>Math.round(t.s/t.m*100))):null; };

/* ================= HOME ================= */
function home(){
  stopTimer();
  const cs=cardStats(), acc=accuracy(), be=bestExam(), weak=weakObjs();
  show(`
  <div class="brand">${IC.logo}<h1>640 Test 2</h1>
    <nav class="tabs" aria-label="Edition"><a href="../">World</a><a href="../usa/">USA</a><a href="../earth/">Earth</a><a href="./" aria-current="page">640 Test 2</a></nav></div>
  <section class="hero">
    <div><div class="eyebrow">BUAN 640 · Applied Statistics${dayStreak()?` · <span class="streak">${dayStreak()}-day streak</span>`:""}</div><h2>One written problem, one of three types</h2></div>
    <p>Closed book, calculator only. You get the formula sheet and the normal table. Graded on your reasoning and wording, not just the number.</p>
    <div class="tpls">${[1,2,3].map(t=>`<button class="tpl" style="--c:var(${TPL[t].c})" data-act="exam" data-t="${t}"><b>${TPL[t].name}</b><span>${["Table → P, E[X], SD","n trials → B(n, p)","z-scores & cutoffs"][t-1]}</span></button>`).join("")}</div>
    <div class="stats3">
      <div class="stat"><b>${cs.got}<small style="font-size:13px;color:var(--ink-3)">/${cs.n}</small></b><span>concepts known</span></div>
      <div class="stat"><b>${acc==null?"–":Math.round(acc*100)+"%"}</b><span>practice accuracy</span></div>
      <div class="stat"><b>${be==null?"–":be+"%"}</b><span>best exam score</span></div>
    </div>
  </section>
  <button class="mode" style="--cc:var(--m-learn)" data-act="learn"><span class="ic">${IC.learn}</span><span><b>Learn key concepts</b><span>Flip cards for every idea on the test</span></span><i>${Math.round(cs.got/cs.n*100)}%</i></button>
  <button class="mode" style="--cc:var(--m-prac)" data-act="practice"><span class="ic">${IC.prac}</span><span><b>Practice questions</b><span>Instant feedback, step by step</span></span><i>${Object.keys(S.qc).length}/${QC.length}</i></button>
  <button class="mode" style="--cc:var(--m-test)" data-act="testmenu"><span class="ic">${IC.test}</span><span><b>Test mode</b><span>Timed, graded at the end</span></span><i>${S.tests.length} run${S.tests.length===1?"":"s"}</i></button>
  <section class="card"><h3>Your weak spots</h3>${weak.length?`<div class="weak">${weak.map(w=>wrow(w.k,w.a)).join("")}</div><button class="btn go wide" data-act="weakqc">Practice these</button>`:`<p class="muted">${Object.keys(S.obj).length?"Nothing below 85% right now. Nice work.":"Answer a few practice questions and the topics you miss most show up here."}</p>`}</section>
  <div class="duo">
    <button class="tile" data-act="ztable"><b>z table</b><span>The same table you get on the test</span></button>
    <button class="tile" data-act="deck" data-d="grading"><b>Full-credit checklist</b><span>What the grader looks for</span></button>
    <button class="tile" data-act="drills"><b>Speed drills</b><span>Fast one-step reps, beat your time</span></button>
    <button class="tile" data-act="cram"><b>Cram sheet</b><span>Everything to memorize on one page</span></button>
  </div>
  <div class="foot">
    <div>Progress saves on this device</div>
    <div class="row" style="justify-content:center"><button class="btn ghost small" data-act="sound">Sounds ${S.sound?"on":"off"}</button><button class="btn ghost small" data-act="reset">Start over</button></div>
    <div>Version ${esc(APP_VERSION)}</div>
  </div>`);
}
function wrow(k,a){ const c=a>=.85?"var(--good)":a>=.6?"var(--sun)":"var(--bad)"; return `<div class="wrow"><span><b>${k}</b> ${esc(OBJ[k]||"")}</span><em>${Math.round(a*100)}%</em><div class="bar2"><i style="width:${Math.max(4,a*100)}%;--c:${c}"></i></div></div>`; }

/* ================= LEARN ================= */
function learn(){
  const cs=cardStats();
  show(`${bar("Learn key concepts")}
  <p class="muted">Tap a card to flip it. Mark it <b>Got it</b> or <b>Still learning</b>; swipe for the next one.</p>
  <div class="row"><button class="btn go" style="flex:1" data-act="review" ${cs.learning?"":"disabled"}>Review still learning (${cs.learning})</button><button class="btn ghost" data-act="allcards">Shuffle all</button></div>
  ${DECKS.map(d=>{ const s=cardStats(d.id); return `<button class="deck" data-act="deck" data-d="${d.id}" data-done="${s.got===s.n?1:0}"><b>${esc(d.title)}</b><em>${s.got}/${s.n}</em><span>${esc(d.sub)}</span><div class="bar2"><i style="width:${s.got/s.n*100}%"></i></div></button>`; }).join("")}`);
}
let CV=null; // card viewer state
function cards(list,title,back="learn"){ CV={list:list.map(c=>({...c, s:(SIMPLE[c.deck]||[])[+c.key.split(":")[1]]})), i:0, side:"f", title, back, got:0, learning:0, simp:false}; renderCards(); }
function renderCards(){
  const c=CV.list[CV.i];
  show(`${bar(CV.title,{back:CV.back, prog:CV.i/CV.list.length})}
  <div class="pn"><button data-act="cprev" ${CV.i?"":"disabled"}>‹ Prev</button><span>${CV.i+1} of ${CV.list.length} · ${esc(c.dt)}</span><button data-act="cnext">Skip ›</button></div>
  <div class="flip" id="flip" data-act="flip" data-side="${CV.side}" data-k="${S.cards[c.key]??""}" role="button" aria-label="Flip card">${cardFace(c)}</div>
  ${CV.simp&&c.s?`<section class="simple" id="simple"><div class="eyebrow">In plain English</div><div class="cb">${c.s}</div></section>`:""}
  <div class="cnav"><button class="btn learn" data-act="mark" data-v="0">Still learning</button><button class="btn got" data-act="mark" data-v="1">Got it</button></div>`);
  const el=$('flip'); let sx=null, sy=0;
  el.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  el.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ e.preventDefault(); dx<0?cardStep(1):cardStep(-1); } });
}
const BULB='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a5.5 5.5 0 0 0-3.2 10c.5.4.7.9.7 1.5v.5h5v-.5c0-.6.2-1.1.7-1.5A5.5 5.5 0 0 0 10 2.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 17.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
function simpBtn(c){ return c.s?`<button class="simp" data-act="simp" aria-label="Explain it simply" aria-pressed="${CV.simp}">${BULB}<span>${CV.simp?"Hide":"Simpler"}</span></button>`:""; }
function cardFace(c){ return simpBtn(c)+(CV.side==="f"?`<div class="eyebrow">${esc(c.dt)}</div><div class="ft">${esc(c.f)}</div><div class="hint">Tap to flip</div>`
  :`<div class="ft">${esc(c.f)}</div><div class="cb">${c.b}</div><div class="hint">Tap to flip back</div>`); }
function flip(){ const el=$('flip'); if(!el) return; el.classList.add("turn");
  setTimeout(()=>{ CV.side=CV.side==="f"?"b":"f"; el.dataset.side=CV.side; el.innerHTML=cardFace(CV.list[CV.i]); el.classList.remove("turn"); },160); }
function cardStep(d){ const n=CV.i+d; if(n<0) return; if(n>=CV.list.length) return cardsDone(); CV.i=n; CV.side="f"; CV.simp=false; renderCards(); }
function mark(v){ const c=CV.list[CV.i]; S.cards[c.key]=v; v?CV.got++:CV.learning++; studied(); save(); if(v) buzz(true,false); cardStep(1); }
function cardsDone(){
  const cs=cardStats(); if(CV.got===CV.list.length) setTimeout(confetti,100);
  show(`${bar(CV.title,{back:CV.back})}
  <section class="card center"><div class="big">${CV.got}</div><p class="muted">marked <b>Got it</b> this round, ${CV.learning} still learning.</p>
  <p class="muted">${cs.got} of ${cs.n} concepts known overall.</p>${CV.got&&!CV.learning?`<p class="cheer">Every card in this round. Great work!</p>`:""}</section>
  ${cs.learning?`<button class="btn go wide" data-act="review">Review still learning (${cs.learning})</button>`:""}
  <button class="btn wide" data-act="practice">Try practice questions</button>
  <button class="btn ghost wide" data-act="learn">Back to decks</button>`);
}

/* ================= PRACTICE ================= */
let PT=1;
function practice(){
  const due=QC.filter((q,i)=>S.qc[i]&&S.qc[i].n<=S.sess).length, unseen=QC.length-Object.keys(S.qc).length;
  const objs=Object.keys(OBJ).filter(k=>S.obj[k]);
  show(`${bar("Practice questions")}
  <section class="card"><h3>Quick checks</h3><p class="muted">One idea per question: notation, event wording, which model fits, definitions. Missed ones come back sooner.</p>
    <p class="muted">${unseen} new · ${due} due for review</p>
    <button class="btn go wide" data-act="qc">Start 10 questions</button></section>
  <section class="card"><h3>Step-by-step problems</h3><p class="muted">A fresh test-style problem in a new context, broken into small steps with feedback on each. The model answer after every part shows exactly what to write.</p>
    <div class="seg" role="group" aria-label="Problem type">${[1,2,3,0].map(t=>`<button data-act="ptype" data-t="${t}" aria-pressed="${PT===t}">${t?TPL[t].name:"Mixed"}<span>${t?["Template 1","Template 2","Template 3"][t-1]:"Any"}</span></button>`).join("")}</div>
    <button class="btn wide" data-act="prob">Start a problem</button></section>
  ${drillCard()}
  ${objs.length?`<section class="card"><h3>Accuracy by topic</h3><div class="weak">${objs.map(k=>{ const o=S.obj[k]; return wrow(k,o.r/(o.r+o.w)); }).join("")}</div></section>`:""}`);
}
function drillCard(){ return `<section class="card" id="drillcard"><h3>Speed drills</h3><p class="muted">10 fast one-step questions. Right answers move on by themselves; get all 10 to set a best time.</p>
  <div class="dgrid">${Object.entries(DRILLS).map(([k,d])=>{ const st=S.drills[k]; return `<button class="tile" data-act="drill" data-k="${k}"><b>${esc(d.title)}</b><span>${esc(d.sub)}</span><span class="best">${st&&st.best!=null?`Best ${fmtT(st.best)}`:"No best yet"}</span></button>`; }).join("")}</div></section>`; }
function pickQC(n,objs){
  S.sess++; save();
  let pool=QC.map((q,i)=>i); if(objs&&objs.length){ const f=pool.filter(i=>QC[i].o.some(o=>objs.includes(o))); if(f.length>=4) pool=f; }
  const st=i=>S.qc[i];
  const due=shuf(pool.filter(i=>st(i)&&st(i).n<=S.sess)).sort((a,b)=>st(a).b-st(b).b);
  const unseen=shuf(pool.filter(i=>!st(i)));
  const rest=shuf(pool.filter(i=>st(i)&&st(i).n>S.sess)).sort((a,b)=>st(a).n-st(b).n);
  return [...due,...unseen,...rest].slice(0,n);
}
function srs(i,ok){ const s=S.qc[i]||{b:0,n:0}; s.b=ok?Math.min(s.b+1,4):0; s.n=S.sess+(ok?[1,2,4,8,16][s.b]:1); S.qc[i]=s; }

/* question runner. mode "prac": instant feedback · "test": held to the end · "drill": instant, auto-advance when right, timed.
   Options are shuffled every time, so you learn the idea, not the position. */
let QR=null;
const qcItem=i=>({...mcShuffle(QC[i]), idx:i});
function runQC(list,mode,title,drill){ QR={items:list.map(x=>typeof x==="number"?qcItem(x):mcShuffle(x)), i:0, mode, title, drill, ans:[], right:0};
  if(mode!=="prac") startTimer(); renderQ(); }
const qBack=()=>QR.mode==="test"?"testmenu":"practice";
function renderQ(){
  const q=QR.items[QR.i], n=QR.items.length;
  show(`${bar(QR.title,{back:qBack(), close:true, prog:QR.i/n, timer:QR.mode!=="prac"})}
  <div class="eyebrow">${QR.drill?esc(DRILLS[QR.drill].title)+" · ":""}Question ${QR.i+1} of ${n}${STK>=2&&QR.mode!=="test"?` <span class="streak">${STK} in a row</span>`:""}</div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.c.map((c,k)=>`<button class="opt" data-act="qopt" data-o="${k}">${esc(c)}</button>`).join("")}</div>
  <div id="qfb"></div>`);
  if(QR.mode!=="prac"&&t0){ const el=$('timer'); if(el) el.textContent=fmtT((Date.now()-t0)/1000); }
}
function qPick(k){
  if(QR.done) return; const q=QR.items[QR.i], ok=k===q.a; QR.done=true;
  QR.ans.push({q,k,ok}); if(ok) QR.right++; rec(q.o,ok); studied();
  const btns=[...app.querySelectorAll(".opt")];
  if(QR.mode==="test"){ btns[k].dataset.s="pick"; save(); setTimeout(()=>{ QR.done=false; qNext(); },260); return; }
  if(q.idx!=null) srs(q.idx,ok); save(); buzz(ok);
  btns.forEach((b,j)=>{ b.disabled=true; b.dataset.s=j===q.a?"right":j===k?"wrong":"fade"; });
  if(QR.mode==="drill"&&ok){ setTimeout(()=>{ if(QR&&QR.done&&QR.items[QR.i]===q) qNext(); },550); return; }
  $('qfb').innerHTML=`<div class="fb" data-k="${ok?"ok":"no"}"><b>${ok?praise():"Not quite."}</b>${esc(q.e)}<div>${(q.o||[]).map(o=>`<span class="tag">${o} ${esc(OBJ[o])}</span>`).join("")}</div></div>
  <div style="height:10px"></div><button class="btn wide" data-act="qnext">${QR.i+1<QR.items.length?"Continue":"See results"}</button>`;
  $('qfb').scrollIntoView({behavior:"smooth",block:"nearest"});
}
function qNext(){ QR.done=false; QR.i++; if(QR.i<QR.items.length) return renderQ(); qResults(); }
function qResults(){
  const secs=QR.mode!=="prac"?stopTimer():0, n=QR.items.length, pct=QR.right/n;
  let note="";
  if(QR.mode==="test"){ S.tests.push({d:Date.now(), k:"quiz", s:QR.right, m:n, t:secs}); }
  if(QR.mode==="drill"){ const d=S.drills[QR.drill]||(S.drills[QR.drill]={best:null,runs:0}); d.runs++;
    if(QR.right===n&&(d.best==null||secs<d.best)){ note=d.best==null?"First perfect run. That's your time to beat.":`New best time! Old best was ${fmtT(d.best)}.`; d.best=secs; }
    else if(d.best!=null) note=QR.right===n?`Best time: ${fmtT(d.best)}`:`Get all ${n} right to set a best time (best: ${fmtT(d.best)}).`;
    else note=`Get all ${n} right to set a best time.`; }
  save();
  const by={}; QR.ans.forEach(a=>(a.q.o||[]).forEach(o=>{ const b=by[o]||(by[o]={r:0,n:0}); b.n++; if(a.ok) b.r++; }));
  const missed=QR.ans.filter(a=>!a.ok);
  const again=QR.mode==="test"?`data-act="quiz">Take another quiz`:QR.mode==="drill"?`data-act="drill" data-k="${QR.drill}">Go again`:`data-act="qc">10 more questions`;
  show(`${bar(QR.title,{back:qBack()})}
  <section class="card center"><div class="big">${QR.right}/${n}</div><p class="muted">${QR.mode!=="prac"?`in ${fmtT(secs)} · `:""}${Math.round(pct*100)}% right</p>${pct===1?`<p class="cheer">${pick(["Perfect round!","Flawless.","Every single one. Great work!"])}</p>`:pct>=.8?`<p class="cheer">Strong round. Keep it up!</p>`:""}${note?`<p class="muted">${esc(note)}</p>`:""}</section>
  ${QR.mode==="test"?`<section class="card"><h3>By topic</h3><div class="weak">${Object.entries(by).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([o,b])=>wrow(o,b.r/b.n)).join("")}</div></section>`:""}
  ${missed.length?`<section class="card"><h3>Review what you missed</h3>${missed.map(a=>`<div class="fb" data-k="no"><b>${esc(a.q.q)}</b>You chose: ${esc(a.q.c[a.k])}<br><b style="display:inline;font-size:15px">Answer:</b> ${esc(a.q.c[a.q.a])}<br><span class="muted">${esc(a.q.e)}</span></div>`).join("")}</section>`:""}
  <button class="btn go wide" ${again}</button>
  <button class="btn ghost wide" data-act="home">Home</button>`);
  if(pct===1) confetti();
}
